services:
  nginx:
    image: nginx:stable-alpine
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./logs:/var/log/nginx
    ports:
      # Worktree-local remap (ai-provider-abstraction) — avoids colliding with the
      # main checkout (8080) and the v1.5 worktree (8081). Do not revert to 8080 here.
      - "8083:80"

  tinysiem:
    build: ./app
    env_file: .env
    environment:
      TINYSIEM_MCP_ENABLED: "false"
    volumes:
      - ./logs:/app/logs:ro
      - ./ui:/app/ui:ro
      - tinysiem_data:/app/data
    ports:
      # Worktree-local remap (ai-provider-abstraction) — avoids colliding with the
      # main checkout's stack (8000/5140/5141) and the v1.5 worktree (8001/5150/5151).
      - "8003:8000"
      - "5154:5140/udp"
      - "5155:5141"
    depends_on:
      - nginx

volumes:
  tinysiem_data:
