services:
  nginx:
    image: nginx:stable-alpine
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./logs:/var/log/nginx
    ports:
      - "8080:80"

  tinysiem:
    build: ./app
    env_file: .env
    environment:
      TINYSIEM_CLAUDE_API_KEY: ""
      TINYSIEM_MCP_ENABLED: "false"
    volumes:
      - ./logs:/app/logs:ro
      - ./ui:/app/ui:ro
      - tinysiem_data:/app/data
    ports:
      - "8000:8000"
      - "5140:5140/udp"
      - "5141:5141"
    depends_on:
      - nginx

volumes:
  tinysiem_data:
