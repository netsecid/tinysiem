services:
  nginx:
    image: nginx:stable-alpine
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./logs:/var/log/nginx
    ports:
      # Worktree-local remap (v1.0-ui-polish) — do not merge this line change.
      - "8086:80"

  tinysiem:
    build: ./app
    env_file: .env
    environment:
      TINYSIEM_MCP_ENABLED: "false"
    volumes:
      - ./logs:/app/logs:ro
      - ./ui:/app/ui:ro
      - tinysiem_data:/app/data
    ports:
      # Worktree-local remap (v1.0-ui-polish) — do not merge this line change.
      - "8006:8000"
      - "5160:5140/udp"
      - "5161:5141"
    depends_on:
      - nginx

volumes:
  tinysiem_data:
