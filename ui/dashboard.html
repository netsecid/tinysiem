<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TinySIEM — Dashboard</title>
<link rel="icon" href="/ui/assets/favicon.svg" type="image/svg+xml">
<link rel="alternate icon" href="/ui/assets/favicon-32.png" type="image/png">
<link rel="apple-touch-icon" href="/ui/assets/apple-touch-icon.png">
<link href="fonts.css" rel="stylesheet">
<script src="vendor/chart.umd.min.js"></script>
<link rel="stylesheet" href="/ui/shared.css">
<script src="nav.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0d0e17;--surface:#12131f;--surface2:#191a2d;--surface3:#1f2138;--surface4:#252845;
  --border:#252840;--border2:#323560;--text:#cdd0eb;--text-dim:#7b7fa8;--text-muted:#454870;
  --accent:#4d9fff;--accent-dim:#0d2a50;--green:#3ddc84;--green-dim:#0a2e1c;
  --red:#e85555;--red-dim:#320c0c;--yellow:#f5c842;--yellow-dim:#322800;
  --mono:'IBM Plex Mono',monospace;--sans:'IBM Plex Sans',sans-serif;
}
[data-theme="light"]{
  --bg:#f0f2f8;--surface:#ffffff;--surface2:#f5f7fc;--surface3:#eaecf5;--surface4:#e0e3f0;
  --border:#dde0f0;--border2:#c0c6e0;--text:#1a1c2e;--text-dim:#4a4f6a;--text-muted:#9096b8;
  --accent:#2979ff;--accent-dim:#e3ecff;--green:#1a8a4a;--green-dim:#eaf7ef;--red:#c0392b;--red-dim:#fde8e6;
  --yellow:#c47800;--yellow-dim:#fff4d6;
}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:var(--sans);font-size:13px;line-height:1.5;overflow:hidden}
.nav-btn{width:30px;height:30px;display:flex;align-items:center;justify-content:center;background:none;border:1px solid var(--border);border-radius:4px;color:var(--text-dim);cursor:pointer;font-size:14px;transition:all .15s}
.nav-btn:hover{color:var(--text);border-color:var(--border2);background:var(--surface3)}
.dash-body{flex:1;overflow-y:auto;padding:16px 20px}
.dash-body::-webkit-scrollbar{width:6px}
.dash-body::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px}
.widget-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.widget-card{background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:14px;min-height:180px;display:flex;flex-direction:column;position:relative}
.widget-card.edit-mode{border-color:var(--accent-dim)}
.widget-card.col-2{grid-column:span 2}
.widget-card.col-3{grid-column:span 3}
.widget-card.row-2{grid-row:span 2}
.widget-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.widget-title{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.07em;color:var(--text-muted)}
.widget-menu{position:relative}
.widget-menu-btn{background:none;border:none;color:var(--text-dim);cursor:pointer;font-size:16px;padding:0 4px;line-height:1}
.widget-menu-btn:hover{color:var(--text)}
.widget-dropdown{display:none;position:absolute;right:0;top:100%;background:var(--surface3);border:1px solid var(--border2);border-radius:4px;min-width:120px;z-index:10}
.widget-dropdown.open{display:block}
.widget-dropdown button{display:block;width:100%;text-align:left;background:none;border:none;color:var(--text);font-size:12px;padding:7px 12px;cursor:pointer}
.widget-dropdown button:hover{background:var(--surface4)}
.widget-body{flex:1;overflow:hidden}
.widget-footer{font-family:var(--mono);font-size:10px;color:var(--text-muted);margin-top:8px}
.edit-overlay{display:none;position:absolute;inset:0;background:rgba(13,14,23,.7);border-radius:6px;align-items:center;justify-content:center;gap:8px;flex-direction:column}
.widget-card.edit-mode .edit-overlay{display:flex}
.edit-remove{position:absolute;top:8px;right:8px;background:var(--red-dim);border:1px solid var(--red);color:var(--red);border-radius:4px;cursor:pointer;font-size:12px;padding:2px 7px}
.sev-dot{width:8px;height:8px;border-radius:50%;display:inline-block}
.feed-table{width:100%;border-collapse:collapse}
.feed-table th{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--text-muted);padding:4px 6px;border-bottom:1px solid var(--border);text-align:left}
.feed-table td{padding:5px 6px;border-bottom:1px solid var(--border);font-size:11.5px;vertical-align:middle}
.empty-state{padding:20px;text-align:center;color:var(--text-muted);font-size:12px}
.spinner{display:inline-block;width:12px;height:12px;border:2px solid var(--border2);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite;vertical-align:middle;margin-right:6px}
@keyframes spin{to{transform:rotate(360deg)}}
.edit-bar{display:none;background:var(--surface2);border-bottom:1px solid var(--border2);padding:8px 20px;align-items:center;gap:10px}
.edit-bar.visible{display:flex}
.edit-title-input{background:var(--surface3);border:1px solid var(--border2);color:var(--text);padding:5px 10px;border-radius:4px;font-size:13px}
.add-widget-btn{margin-top:10px;width:100%;padding:14px;border:2px dashed var(--border2);background:none;color:var(--text-dim);border-radius:6px;cursor:pointer;font-size:12px;display:none}
.add-widget-btn:hover{border-color:var(--accent);color:var(--accent)}
.modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:100;align-items:center;justify-content:center}
.modal-bg.open{display:flex}
.modal{background:var(--surface2);border:1px solid var(--border2);border-radius:8px;padding:24px;width:420px;max-height:80vh;overflow-y:auto}
.modal h3{font-size:13px;font-weight:600;margin-bottom:16px}
.form-field{margin-bottom:12px}
.form-field label{font-size:11px;color:var(--text-dim);display:block;margin-bottom:4px}
.form-field input,.form-field select{width:100%;background:var(--surface3);border:1px solid var(--border2);color:var(--text);padding:6px 8px;border-radius:4px;font-size:12px}
.type-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.type-opt{padding:8px 10px;border:1px solid var(--border2);border-radius:4px;cursor:pointer;font-size:12px;text-align:center}
.type-opt:hover,.type-opt.selected{border-color:var(--accent);background:var(--accent-dim);color:var(--accent)}
.btn-row{display:flex;gap:8px;justify-content:flex-end;margin-top:12px}
</style>
</head>
<body>
<div class="layout">
  <div id="nav-root"></div>

  <div class="main-wrap">
    <div class="topbar">
      <span class="topbar-title" id="dashTitleDisplay">Dashboard</span>
      <div class="topbar-right">
        <button class="nav-btn" onclick="exportHtml()" title="Export HTML snapshot" style="font-size:11px;width:auto;padding:0 8px">⬇ Export</button>
        <button class="nav-btn" id="customizeBtn" onclick="enterEdit()" title="Customize dashboard" style="font-size:11px;width:auto;padding:0 8px">✎ Customize</button>
        <button class="nav-btn" onclick="refreshAll()" title="Refresh all widgets">↻</button>
      </div>
    </div>

    <!-- Edit bar (hidden in view mode) -->
    <div class="edit-bar" id="editBar">
      <span style="font-size:11px;color:var(--accent);font-weight:600">[Editing]</span>
      <span style="font-size:11px;color:var(--text-dim)">Title:</span>
      <input class="edit-title-input" id="editTitleInput" type="text" value="Dashboard">
      <div style="margin-left:auto;display:flex;gap:8px">
        <button class="btn-sec" onclick="cancelEdit()">Cancel</button>
        <button class="btn-prim" onclick="saveLayout()">Save</button>
      </div>
    </div>

    <div class="dash-body" id="dashBody">
      <div class="widget-grid" id="widgetGrid"></div>
      <button class="add-widget-btn" id="addWidgetBtn" onclick="openAddWidget()">+ Add Widget</button>
      <div style="margin-top:8px;font-size:11px;color:var(--text-muted);display:none" id="editHint">Click widget × to remove · Click Edit to change settings · Drag-and-drop coming in v1.3</div>
    </div>
  </div>
</div>

<!-- Widget settings modal -->
<div class="modal-bg" id="widgetModal">
  <div class="modal">
    <h3 id="widgetModalTitle">Add Widget</h3>
    <div id="typePicker" style="display:none">
      <div style="font-size:11px;color:var(--text-dim);margin-bottom:8px">Select widget type:</div>
      <div class="type-grid" id="typeGrid"></div>
    </div>
    <div class="form-field">
      <label>Title</label>
      <input id="wTitle" type="text" placeholder="Widget title">
    </div>
    <div id="wConfigFields"></div>
    <div class="form-field">
      <label>Width (columns)</label>
      <select id="wWidth"><option value="1">1 column</option><option value="2" selected>2 columns</option><option value="3">3 columns</option></select>
    </div>
    <div class="btn-row">
      <button class="btn-sec" onclick="closeWidgetModal()">Cancel</button>
      <button class="btn-prim" id="widgetModalSave" onclick="saveWidgetModal()">Add</button>
    </div>
  </div>
</div>

<script>
const TH=document.documentElement;
const S={theme:'dark',jwt:'',ep:'',editMode:false,widgets:[],title:'Dashboard',charts:{},timers:{},editingWidgetId:null};

const WIDGET_TYPES={
  event_volume:{name:'Event Volume',defaultTitle:'Event Volume (24h)',config:[{id:'time_range',label:'Time range',type:'select',opts:['1h','6h','24h','7d'],def:'24h'},{id:'buckets',label:'Buckets',type:'number',def:48}]},
  top_sources:{name:'Top Sources',defaultTitle:'Top Log Sources',config:[{id:'time_range',label:'Time range',type:'select',opts:['1h','6h','24h','7d'],def:'24h'},{id:'limit',label:'Count',type:'number',def:10}]},
  top_ips:{name:'Top Source IPs',defaultTitle:'Top Source IPs',config:[{id:'time_range',label:'Time range',type:'select',opts:['1h','6h','24h','7d'],def:'24h'},{id:'limit',label:'Count',type:'number',def:10}]},
  alert_severity:{name:'Alert Severity',defaultTitle:'Alert Severity',config:[{id:'time_range',label:'Time range',type:'select',opts:['1h','6h','24h','7d'],def:'7d'}]},
  recent_alerts:{name:'Recent Alerts',defaultTitle:'Recent Alerts',config:[{id:'limit',label:'Count',type:'number',def:5}]},
  case_status:{name:'Case Status',defaultTitle:'Open Cases',config:[]},
  baseline_health:{name:'Baseline Health',defaultTitle:'Baseline Health',config:[]},
};

const SEV_COLORS={critical:'#e85555',high:'#f5c842',medium:'#4d9fff',low:'#3ddc84'};

function esc(s){return String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;')}
function uuid4(){return([1e7]+-1e3+-4e3+-8e3+-1e11).replace(/[018]/g,c=>(c^crypto.getRandomValues(new Uint8Array(1))[0]&15>>c/4).toString(16))}

async function api(path,opts={}){
  const res=await fetch(S.ep+path,{...opts,headers:{...opts.headers,'Authorization':'Bearer '+S.jwt,'Content-Type':'application/json'}});
  if(res.status===401){clearAuth();window.location.href='/ui/login.html';return null}
  return res;
}

function timeRangeToStart(tr){
  const now=new Date();const s={s:{},map:{'1h':3600,'6h':21600,'24h':86400,'7d':604800}};
  return new Date(now-((s.map[tr]||86400)*1000)).toISOString();
}

// ── Widget rendering ───────────────────────────────────────────────────────────

async function renderWidget(w){
  const el=document.getElementById('wb_'+w.widget_id);
  const ft=document.getElementById('wf_'+w.widget_id);
  if(!el)return;
  el.innerHTML='<span class="spinner"></span>';
  const cfg=w.config||{};
  const startTime=cfg.time_range?timeRangeToStart(cfg.time_range):null;
  const qs=startTime?'?start='+encodeURIComponent(startTime):'';
  const tsStr=new Date().toLocaleTimeString();
  try{
    if(w.type==='event_volume'){
      const b=cfg.buckets||48;
      const r=await api('/events/histogram?buckets='+b+(startTime?'&start='+encodeURIComponent(startTime):'&start='+encodeURIComponent(timeRangeToStart('24h'))));
      if(!r){el.innerHTML='<div class="empty-state">Error</div>';return}
      const d=await r.json();
      // API returns [{ts: ms_epoch, count}] directly
      const buckets=Array.isArray(d)?d:(d.buckets||[]);
      const labels=buckets.map(bk=>new Date(bk.ts).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}));
      const data=buckets.map(bk=>bk.count);
      el.innerHTML='<canvas id="ch_'+w.widget_id+'" style="width:100%;height:120px"></canvas>';
      if(S.charts[w.widget_id])S.charts[w.widget_id].destroy();
      S.charts[w.widget_id]=new Chart(document.getElementById('ch_'+w.widget_id),{
        type:'bar',data:{labels,datasets:[{data,backgroundColor:'rgba(77,159,255,.5)',borderColor:'rgba(77,159,255,1)',borderWidth:1,barPercentage:.9}]},
        options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{x:{display:false},y:{display:true,ticks:{color:'#7b7fa8',font:{size:10}},grid:{color:'#252840'}}}},
      });
      if(ft)ft.textContent='Refreshed '+tsStr;
    }
    else if(w.type==='top_sources'||w.type==='top_ips'){
      const key=w.type==='top_sources'?'source':'source_ip';
      const r=await api('/events/facets'+(startTime?'?start='+encodeURIComponent(startTime):''));
      if(!r){el.innerHTML='<div class="empty-state">Error</div>';return}
      const d=await r.json();
      const items=(d[key]||[]).slice(0,cfg.limit||10);
      const max=items.length?items[0].count:1;
      el.innerHTML=items.length?items.map(it=>`<div style="display:flex;align-items:center;gap:8px;padding:3px 0">
        <div style="width:120px;font-family:var(--mono);font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text)">${esc(it.value||'—')}</div>
        <div style="flex:1;height:4px;background:var(--border);border-radius:2px"><div style="width:${Math.round(it.count/max*100)}%;height:100%;background:var(--accent);border-radius:2px"></div></div>
        <div style="font-family:var(--mono);font-size:11px;color:var(--text-dim);width:40px;text-align:right">${it.count}</div>
      </div>`).join(''):'<div class="empty-state">No data</div>';
      if(ft)ft.textContent='Refreshed '+tsStr;
    }
    else if(w.type==='alert_severity'){
      const r=await api('/alerts/facets'+(startTime?'?start='+encodeURIComponent(startTime):''));
      if(!r){el.innerHTML='<div class="empty-state">Error</div>';return}
      const d=await r.json();
      const sevs=d.severity||[];
      const total=sevs.reduce((s,it)=>s+it.count,0);
      el.innerHTML=sevs.length?`<canvas id="ch_${w.widget_id}" style="width:80px;height:80px;display:block;margin:0 auto 8px"></canvas>`+sevs.map(it=>`<div style="display:flex;align-items:center;gap:8px;font-size:12px"><span class="sev-dot" style="background:${SEV_COLORS[it.value]||'var(--text-muted)'}"></span><span style="color:var(--text-dim);width:70px;text-transform:capitalize">${esc(it.value)}</span><span style="font-family:var(--mono)">${it.count}</span></div>`).join(''):'<div class="empty-state">No alerts</div>';
      if(sevs.length){
        if(S.charts[w.widget_id])S.charts[w.widget_id].destroy();
        S.charts[w.widget_id]=new Chart(document.getElementById('ch_'+w.widget_id),{
          type:'doughnut',data:{labels:sevs.map(s=>s.value),datasets:[{data:sevs.map(s=>s.count),backgroundColor:sevs.map(s=>SEV_COLORS[s.value]||'#7b7fa8'),borderWidth:0}]},
          options:{responsive:false,cutout:'60%',plugins:{legend:{display:false}}},
        });
      }
      if(ft)ft.textContent='Total '+total+' · Refreshed '+tsStr;
    }
    else if(w.type==='recent_alerts'){
      const limit=cfg.limit||5;
      const r=await api('/alerts?limit='+limit);
      if(!r){el.innerHTML='<div class="empty-state">Error</div>';return}
      const d=await r.json();
      const alerts=d.alerts||[];
      el.innerHTML=alerts.length?`<table class="feed-table"><thead><tr><th>Rule</th><th>IP</th><th>Sev</th></tr></thead><tbody>${alerts.map(al=>`<tr><td style="max-width:130px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(al.rule_name)}</td><td style="font-family:var(--mono);font-size:11px">${esc(al.source_ip||'—')}</td><td><span class="sev-dot" style="background:${SEV_COLORS[al.severity]||'var(--text-muted)'}"></span> ${esc(al.severity)}</td></tr>`).join('')}</tbody></table>`:'<div class="empty-state">No alerts</div>';
      if(ft)ft.textContent='Refreshed '+tsStr;
    }
    else if(w.type==='case_status'){
      const r=await api('/cases/facets');
      if(!r){el.innerHTML='<div class="empty-state">Error</div>';return}
      const d=await r.json();
      const statuses=d.status||[];
      const total=statuses.reduce((s,it)=>s+it.count,0);
      const CASE_COLORS={open:'var(--yellow)',in_progress:'var(--accent)',resolved:'var(--green)',closed:'var(--text-muted)'};
      el.innerHTML=statuses.length?statuses.map(it=>`<div style="display:flex;align-items:center;gap:8px;font-size:12px;padding:2px 0"><span class="sev-dot" style="background:${CASE_COLORS[it.value]||'var(--text-muted)'}"></span><span style="color:var(--text-dim);text-transform:capitalize;width:100px">${esc(it.value)}</span><span style="font-family:var(--mono)">${it.count}</span></div>`).join(''):'<div class="empty-state">No cases</div>';
      if(ft)ft.textContent='Total '+total+' cases · Refreshed '+tsStr;
    }
    else if(w.type==='baseline_health'){
      const r=await api('/baselines/violations?acknowledged=false&limit=200');
      if(!r){el.innerHTML='<div class="empty-state">Error</div>';return}
      const d=await r.json();
      const total=d.total||0;
      const by={};(d.violations||[]).forEach(v=>{by[v.severity]=(by[v.severity]||0)+1});
      el.innerHTML=`<div style="font-size:28px;font-weight:600;color:${total>0?'var(--yellow)':'var(--green)'};margin-bottom:8px">${total}</div><div style="font-size:11px;color:var(--text-dim);margin-bottom:10px">Unacknowledged violations</div>`+Object.entries(by).map(([s,c])=>`<div style="display:flex;align-items:center;gap:8px;font-size:12px;padding:2px 0"><span class="sev-dot" style="background:${SEV_COLORS[s]||'var(--text-muted)'}"></span><span style="color:var(--text-dim);text-transform:capitalize;width:70px">${esc(s)}</span><span style="font-family:var(--mono)">${c}</span></div>`).join('');
      if(ft)ft.textContent='Refreshed '+tsStr;
    }
    else{el.innerHTML='<div class="empty-state">Unknown widget type</div>';}
  }catch(e){el.innerHTML=`<div class="empty-state">Error: ${esc(e.message)}</div>`;}
}

// ── Grid rendering ─────────────────────────────────────────────────────────────

function renderGrid(){
  const grid=document.getElementById('widgetGrid');
  // Sort by row then col
  const sorted=[...S.widgets].sort((a,b)=>{const gp=w=>w.grid_position||{};const ar=gp(a).row||0,br=gp(b).row||0;return ar!==br?ar-br:(gp(a).col||0)-(gp(b).col||0);});
  grid.innerHTML=sorted.map(w=>{
    const gp=w.grid_position||{};
    const cols=Math.min(3,Math.max(1,gp.width||1));
    const rows=Math.min(2,Math.max(1,gp.height||1));
    const colClass=cols>1?'col-'+cols:'';
    const rowClass=rows>1?'row-'+rows:'';
    return `<div class="widget-card ${colClass} ${rowClass} ${S.editMode?'edit-mode':''}" id="wc_${esc(w.widget_id)}" data-widget-id="${esc(w.widget_id)}">
      <div class="widget-hdr">
        <span class="widget-title">${esc(w.title||WIDGET_TYPES[w.type]?.name||w.type)}</span>
        <div class="widget-menu">
          <button class="widget-menu-btn" data-action="toggle-menu">⋮</button>
          <div class="widget-dropdown" id="wm_${esc(w.widget_id)}">
            <button data-action="refresh">↻ Refresh</button>
            <button data-action="edit">✎ Edit settings</button>
            <button data-action="remove" style="color:var(--red)">✕ Remove</button>
          </div>
        </div>
      </div>
      <div class="widget-body" id="wb_${esc(w.widget_id)}"><span class="spinner"></span></div>
      <div class="widget-footer" id="wf_${esc(w.widget_id)}"></div>
      <div class="edit-overlay">
        <button class="edit-remove" data-action="remove">✕ Remove</button>
        <button class="btn-sec" style="font-size:12px" data-action="edit">✎ Edit settings</button>
      </div>
    </div>`;
  }).join('');
  // Start data load + refresh timers
  sorted.forEach(w=>{
    refreshWidget(w.widget_id);
    if(S.timers[w.widget_id])clearInterval(S.timers[w.widget_id]);
    S.timers[w.widget_id]=setInterval(()=>refreshWidget(w.widget_id),60000);
  });
  document.getElementById('addWidgetBtn').style.display=S.editMode?'block':'none';
  document.getElementById('editHint').style.display=S.editMode?'block':'none';
}
document.getElementById('widgetGrid').addEventListener('click', e => {
  const btn = e.target.closest('[data-action]');
  if (!btn) return;
  const card = e.target.closest('[data-widget-id]');
  const widgetId = card?.dataset.widgetId;
  if (!widgetId) return;
  const action = btn.dataset.action;
  if (action === 'toggle-menu') toggleMenu(widgetId);
  else if (action === 'refresh') { refreshWidget(widgetId); closeMenus(); }
  else if (action === 'edit') { editWidget(widgetId); closeMenus(); }
  else if (action === 'remove') { removeWidget(widgetId); closeMenus(); }
});

function refreshWidget(id){const w=S.widgets.find(x=>x.widget_id===id);if(w)renderWidget(w);}
function refreshAll(){S.widgets.forEach(w=>renderWidget(w));}

function toggleMenu(id){
  closeMenus();
  const el=document.getElementById('wm_'+id);
  if(el)el.classList.toggle('open');
}
function closeMenus(){document.querySelectorAll('.widget-dropdown.open').forEach(el=>el.classList.remove('open'));}
document.addEventListener('click',e=>{if(!e.target.closest('.widget-menu'))closeMenus();});

// ── Edit mode ──────────────────────────────────────────────────────────────────

function enterEdit(){
  S.editMode=true;
  document.getElementById('editBar').classList.add('visible');
  document.getElementById('customizeBtn').style.display='none';
  document.getElementById('editTitleInput').value=S.title;
  renderGrid();
}
function cancelEdit(){
  S.editMode=false;
  document.getElementById('editBar').classList.remove('visible');
  document.getElementById('customizeBtn').style.display='';
  loadDashboard();
}
async function saveLayout(){
  const newTitle=document.getElementById('editTitleInput').value.trim()||'Dashboard';
  const r=await api('/dashboard',{method:'PUT',body:JSON.stringify({title:newTitle,widgets:S.widgets})});
  if(!r)return;
  if(r.ok){
    S.title=newTitle;
    document.getElementById('dashTitleDisplay').textContent=newTitle;
    S.editMode=false;
    document.getElementById('editBar').classList.remove('visible');
    document.getElementById('customizeBtn').style.display='';
    renderGrid();
  }else{alert('Failed to save layout');}
}
function removeWidget(id){
  S.widgets=S.widgets.filter(w=>w.widget_id!==id);
  if(S.timers[id]){clearInterval(S.timers[id]);delete S.timers[id];}
  if(S.charts[id]){S.charts[id].destroy();delete S.charts[id];}
  renderGrid();
}

// ── Add/Edit widget modal ──────────────────────────────────────────────────────

let _modalMode='add';

function openAddWidget(){
  _modalMode='add';
  S.editingWidgetId=null;
  document.getElementById('widgetModalTitle').textContent='Add Widget';
  document.getElementById('widgetModalSave').textContent='Add';
  document.getElementById('wTitle').value='';
  document.getElementById('wWidth').value='1';
  document.getElementById('wConfigFields').innerHTML='';
  document.getElementById('typePicker').style.display='';
  const typeGrid=document.getElementById('typeGrid');
  typeGrid.innerHTML=Object.entries(WIDGET_TYPES).map(([k,v])=>`<div class="type-opt" data-type="${k}" onclick="selectWidgetType('${k}')">${v.name}</div>`).join('');
  document.getElementById('widgetModal').classList.add('open');
}
function editWidget(id){
  _modalMode='edit';
  S.editingWidgetId=id;
  const w=S.widgets.find(x=>x.widget_id===id);
  if(!w)return;
  document.getElementById('widgetModalTitle').textContent='Edit Widget';
  document.getElementById('widgetModalSave').textContent='Save';
  document.getElementById('typePicker').style.display='none';
  document.getElementById('wTitle').value=w.title||'';
  document.getElementById('wWidth').value=String((w.grid_position||{}).width||1);
  renderConfigFields(w.type,w.config||{});
  document.getElementById('widgetModal').classList.add('open');
}
function selectWidgetType(type){
  document.querySelectorAll('.type-opt').forEach(el=>el.classList.toggle('selected',el.dataset.type===type));
  const info=WIDGET_TYPES[type];
  document.getElementById('wTitle').value=info?.defaultTitle||'';
  renderConfigFields(type,{});
}
function renderConfigFields(type,cfg){
  const info=WIDGET_TYPES[type];
  document.getElementById('wConfigFields').innerHTML=(info?.config||[]).map(f=>`<div class="form-field"><label>${esc(f.label)}</label>${f.type==='select'?`<select id="wc_f_${f.id}">${f.opts.map(o=>`<option value="${o}"${(cfg[f.id]||f.def)===o?' selected':''}>${o}</option>`).join('')}</select>`:`<input id="wc_f_${f.id}" type="number" value="${cfg[f.id]??f.def??''}">`}</div>`).join('');
}
function getSelectedType(){
  const sel=document.querySelector('.type-opt.selected');
  return sel?sel.dataset.type:null;
}
function closeWidgetModal(){document.getElementById('widgetModal').classList.remove('open');}
function saveWidgetModal(){
  const title=document.getElementById('wTitle').value.trim();
  const width=parseInt(document.getElementById('wWidth').value)||1;
  if(_modalMode==='add'){
    const type=getSelectedType();
    if(!type){alert('Select a widget type');return}
    const info=WIDGET_TYPES[type];
    const cfg={};
    (info?.config||[]).forEach(f=>{const el=document.getElementById('wc_f_'+f.id);if(el)cfg[f.id]=f.type==='number'?parseInt(el.value)||f.def:el.value;});
    const maxRow=S.widgets.reduce((m,w)=>{const r=(w.grid_position||{}).row||0;return r>m?r:m;},0);
    S.widgets.push({widget_id:uuid4(),type,title:title||info?.defaultTitle||type,grid_position:{row:maxRow+1,col:0,width,height:1},config:cfg});
  }else{
    const w=S.widgets.find(x=>x.widget_id===S.editingWidgetId);
    if(!w)return;
    w.title=title;
    w.grid_position={...(w.grid_position||{}),width};
    const info=WIDGET_TYPES[w.type];
    (info?.config||[]).forEach(f=>{const el=document.getElementById('wc_f_'+f.id);if(el)w.config[f.id]=f.type==='number'?parseInt(el.value)||f.def:el.value;});
  }
  closeWidgetModal();
  renderGrid();
}

// ── Load/export ────────────────────────────────────────────────────────────────

async function loadDashboard(){
  const r=await api('/dashboard');
  if(!r)return;
  const d=await r.json();
  S.widgets=d.widgets||[];
  S.title=d.title||'Dashboard';
  document.getElementById('dashTitleDisplay').textContent=S.title;
  renderGrid();
}

async function exportHtml(){
  const r=await api('/dashboard/export/html',{method:'POST'});
  if(!r)return;
  if(r.ok){
    const blob=await r.blob();
    const cd=r.headers.get('content-disposition')||'';
    const m=cd.match(/filename="([^"]+)"/);
    const fname=m?m[1]:'dashboard.html';
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');a.href=url;a.download=fname;a.click();URL.revokeObjectURL(url);
  }
}

function load(){
  S.theme=localStorage.getItem('ts_theme')||'dark';
  TH.setAttribute('data-theme',S.theme);
  S.jwt=localStorage.getItem('ts_jwt')||'';
  S.ep=localStorage.getItem('ts_ep')||'http://localhost:8000';
  if(!S.jwt){window.location.href='/ui/login.html';return}
  const p=parseJwt(S.jwt);
  if(!p||p.exp*1000<Date.now()){clearAuth();window.location.href='/ui/login.html';return}
  loadDashboard();
}
window.addEventListener('DOMContentLoaded',load);
</script>
