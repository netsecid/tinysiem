<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TinySIEM — Alerts</title>
<link href="fonts.css" rel="stylesheet">
<link rel="stylesheet" href="/ui/shared.css">
<script src="nav.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

:root{
  --radius: 6px;
  --bg:#0d0e17;
  --surface:#12131f;
  --surface2:#191a2d;
  --surface3:#1f2138;
  --surface4:#252845;
  --border:#252840;
  --border2:#323560;
  --text:#cdd0eb;
  --text-dim:#7b7fa8;
  --text-muted:#454870;
  --accent:#4d9fff;
  --accent-dim:#0d2a50;
  --green:#3ddc84;
  --green-dim:#0a2e1c;
  --yellow:#f5c842;
  --yellow-dim:#322800;
  --orange:#f07832;
  --orange-dim:#2a1800;
  --red:#e85555;
  --red-dim:#320c0c;
  --teal:#2dd4bf;
  --purple:#a78bfa;
  --mono:'IBM Plex Mono',monospace;
  --sans:'IBM Plex Sans',sans-serif;
  --sidebar-w:232px;
}
[data-theme="light"]{
  --bg:#f0f2f8;
  --surface:#ffffff;
  --surface2:#f5f7fc;
  --surface3:#eaecf5;
  --surface4:#e0e3f0;
  --border:#dde0f0;
  --border2:#c0c6e0;
  --text:#1a1c2e;
  --text-dim:#4a4f6a;
  --text-muted:#9096b8;
  --accent:#2979ff;
  --accent-dim:#e3ecff;
  --green:#1a8a4a;
  --green-dim:#eaf7ef;
  --yellow:#c47800;
  --yellow-dim:#fff4d6;
  --orange:#b84800;
  --orange-dim:#fff0e0;
  --red:#c0392b;
  --red-dim:#fde8e6;
  --teal:#0a7a6a;
  --purple:#5a2ed0;
}

html,body{height:100%;background:var(--bg);color:var(--text);font-family:var(--sans);font-size:13px;line-height:1.5;overflow:hidden}

.nav-btn{width:30px;height:30px;display:flex;align-items:center;justify-content:center;background:none;border:1px solid var(--border);border-radius:4px;color:var(--text-dim);cursor:pointer;font-size:14px;transition:all .15s}
.nav-btn:hover{color:var(--text);border-color:var(--border2);background:var(--surface3)}

/* ── APP LAYOUT ── */
.top-area{flex-shrink:0;background:var(--surface);border-bottom:1px solid var(--border)}
.body-area{flex:1;display:flex;overflow:hidden}

/* ── SEARCH BAR ── */
.search-bar{display:flex;align-items:center;gap:8px;padding:8px 14px}
.search-wrap{flex:1;display:flex;align-items:center;background:var(--bg);border:1px solid var(--border2);border-radius:5px;padding:0 10px;gap:7px;transition:border-color .15s}
.search-wrap:focus-within{border-color:var(--accent)}
.search-icon{color:var(--text-muted);flex-shrink:0;opacity:.7}
.search-input{flex:1;background:none;border:none;outline:none;color:var(--text);font-family:var(--mono);font-size:12.5px;padding:6px 0}
.search-input::placeholder{color:var(--text-muted)}
.search-clear{background:none;border:none;color:var(--text-muted);cursor:pointer;padding:0 3px;font-size:14px;line-height:1;display:none}
.search-clear.show{display:block}
.search-btn{padding:0 14px;height:32px;background:var(--accent);border:none;border-radius:5px;color:#fff;font-size:13px;font-weight:500;cursor:pointer;white-space:nowrap}
.search-btn:hover{opacity:.88}

/* ── ACTIVE FILTERS STRIP ── */
.active-filters{display:flex;gap:5px;padding:0 14px 8px;flex-wrap:wrap;min-height:0}
.active-filters:empty{padding:0}
.filter-chip{display:inline-flex;align-items:center;gap:4px;padding:2px 7px;background:var(--accent-dim);border:1px solid var(--accent);border-radius:3px;font-family:var(--mono);font-size:11px;color:var(--accent)}
.chip-rm{background:none;border:none;color:var(--accent);cursor:pointer;font-size:13px;line-height:1;padding:0;opacity:.6}
.chip-rm:hover{opacity:1}

/* ── SIDEBAR ── */
.sidebar{width:var(--sidebar-w);flex-shrink:0;background:var(--surface);border-right:1px solid var(--border);overflow-y:auto;display:flex;flex-direction:column}
.sidebar::-webkit-scrollbar{width:4px}
.sidebar::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px}
.sb-head{padding:10px 12px 6px;font-size:11px;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:.08em;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.sb-clear{background:none;border:none;color:var(--text-muted);font-size:11px;cursor:pointer;padding:0}
.sb-clear:hover{color:var(--accent)}
.facet-group{border-bottom:1px solid var(--border)}
.facet-hdr{display:flex;align-items:center;justify-content:space-between;padding:8px 12px 6px;cursor:pointer;user-select:none}
.facet-hdr:hover{background:var(--surface3)}
.facet-title{font-size:11.5px;font-weight:600;color:var(--text-dim);display:flex;align-items:center;gap:5px}
.facet-chevron{color:var(--text-muted);transition:transform .2s;font-size:10px}
.facet-group.open .facet-chevron{transform:rotate(0)}
.facet-group:not(.open) .facet-chevron{transform:rotate(-90deg)}
.facet-body{display:none;padding:0 8px 8px}
.facet-group.open .facet-body{display:block}
.fv{display:flex;align-items:center;gap:6px;padding:3px 6px;border-radius:4px;cursor:pointer;transition:background .1s}
.fv:hover{background:var(--surface3)}
.fv.active{background:var(--accent-dim)}
.fv-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;background:var(--border2)}
.fv-label{flex:1;font-size:12px;color:var(--text-dim);font-family:var(--mono);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fv.active .fv-label{color:var(--accent)}
.fv-count{font-size:11px;color:var(--text-muted);font-family:var(--mono);flex-shrink:0}
.fv-bar-wrap{width:100%;height:2px;background:var(--border);border-radius:1px;margin-top:2px}
.fv-bar{height:100%;border-radius:1px;min-width:2px}
.fv-inner{flex:1;min-width:0}
.facet-empty{padding:4px 6px 8px;font-size:11px;color:var(--text-muted)}

/* severity dot colors */
.dot-critical{background:var(--severity-critical)}
.dot-high{background:var(--severity-high)}
.dot-medium{background:var(--severity-medium)}
.dot-low{background:var(--severity-low)}
.dot-unknown{background:var(--text-muted)}
.dot-rule{background:var(--teal)}

/* ── MAIN PANEL ── */
.main-panel{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0}

/* ── CONTROLS ── */
.controls{display:flex;align-items:center;gap:6px;padding:6px 12px;background:var(--surface2);border-bottom:1px solid var(--border);flex-shrink:0}
.ctrl-sel{background:var(--surface3);border:1px solid var(--border2);border-radius:4px;color:var(--text);font-size:12px;padding:3px 7px;cursor:pointer;height:26px}
.ctrl-sel:focus{outline:none;border-color:var(--accent)}
.ctrl-btn{display:flex;align-items:center;gap:4px;padding:0 9px;height:26px;background:var(--surface3);border:1px solid var(--border2);border-radius:4px;color:var(--text-dim);font-size:12px;cursor:pointer;transition:all .12s;white-space:nowrap}
.ctrl-btn:hover{color:var(--text);background:var(--surface4)}
.ctrl-space{flex:1}
.result-info{font-family:var(--mono);font-size:11.5px;color:var(--text-muted)}
.result-info b{color:var(--text);font-weight:500}
.pager{display:flex;align-items:center;gap:3px}
.page-btn{width:26px;height:26px;display:flex;align-items:center;justify-content:center;background:var(--surface3);border:1px solid var(--border2);border-radius:4px;color:var(--text-dim);cursor:pointer;font-size:13px;transition:all .12s}
.page-btn:hover:not(:disabled){color:var(--text);border-color:var(--accent)}
.page-btn:disabled{opacity:.3;cursor:default}
.page-info{font-family:var(--mono);font-size:11px;color:var(--text-dim);padding:0 5px;min-width:48px;text-align:center}

/* ── TABLE ── */
.table-scroll{flex:1;overflow:auto}
.table-scroll::-webkit-scrollbar{width:6px;height:6px}
.table-scroll::-webkit-scrollbar-track{background:var(--surface)}
.table-scroll::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px}
table{width:100%;border-collapse:collapse;table-layout:fixed}
thead th{position:sticky;top:0;background:var(--surface2);color:var(--text-muted);font-size:10.5px;font-weight:600;text-transform:uppercase;letter-spacing:.07em;padding:6px 10px;border-bottom:1px solid var(--border);text-align:left;white-space:nowrap;z-index:2}
tbody td{padding:7px 10px;border-bottom:1px solid var(--border);vertical-align:middle;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:12.5px}
.col-exp{width:24px}.col-time{width:160px}.col-rule{width:200px}
.col-sev{width:90px}.col-ip{width:120px}.col-mitre{width:140px}
.col-tech{width:100px}.col-sum{width:auto;min-width:160px}
tr.dr{cursor:pointer;transition:background .08s}
tr.dr:hover{background:var(--surface3)}
tr.dr.open{background:var(--surface3)}
tr.expand-row td{padding:0;background:var(--surface2);border-bottom:2px solid var(--border2);white-space:normal}
.exp-body{padding:12px 14px 14px 32px}
.exp-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:4px;margin-bottom:10px}
.ef{padding:5px 8px;background:var(--surface3);border:1px solid var(--border);border-radius:4px}
.ef-k{font-size:9.5px;color:var(--text-muted);font-family:var(--mono);text-transform:uppercase;letter-spacing:.05em;display:block;margin-bottom:1px}
.ef-v{font-family:var(--mono);font-size:11.5px;color:var(--text);word-break:break-all}

/* ── SEVERITY BADGES ── */
.badge{display:inline-flex;align-items:center;padding:1px 6px;border-radius:3px;font-family:var(--mono);font-size:11px;font-weight:600;line-height:16px;text-transform:uppercase;letter-spacing:.04em}
.sev-critical{background:var(--red-dim);color:var(--red);border:1px solid var(--red)}
.sev-high{background:var(--orange-dim);color:var(--orange);border:1px solid var(--orange)}
.sev-medium{background:var(--yellow-dim);color:var(--yellow);border:1px solid var(--yellow)}
.sev-low{background:var(--green-dim);color:var(--green);border:1px solid var(--green)}
.sev-unknown{background:var(--surface4);color:var(--text-muted);border:1px solid var(--border2)}

/* mitre badge */
.mbadge{display:inline-flex;padding:1px 5px;border-radius:3px;font-family:var(--mono);font-size:10.5px;background:var(--surface4);color:var(--purple);border:1px solid var(--border2)}

@keyframes slideIn{from{background:color-mix(in srgb,var(--red) 10%,transparent)}to{background:transparent}}
.rn{animation:slideIn 2s ease-out}
@keyframes spin{to{transform:rotate(360deg)}}
.spinner{display:inline-block;width:14px;height:14px;border:2px solid var(--border2);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite;vertical-align:middle;margin-right:7px}
.empty-row td{text-align:center;padding:52px;color:var(--text-muted);font-size:12.5px}

/* ── ALERT DETAIL MODAL ── */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:200;display:none;align-items:center;justify-content:center;padding:20px}
.modal-bg.show{display:flex}
.detail-modal{background:var(--surface2);border:1px solid var(--border2);border-radius:8px;width:760px;max-width:100%;max-height:88vh;display:flex;flex-direction:column}
.dm-head{display:flex;align-items:flex-start;gap:12px;padding:14px 16px;border-bottom:1px solid var(--border);flex-shrink:0}
.dm-title-wrap{flex:1;min-width:0}
.dm-rule{font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dm-time{font-family:var(--mono);font-size:11px;color:var(--text-muted);margin-top:2px}
.dm-close{width:26px;height:26px;display:flex;align-items:center;justify-content:center;background:none;border:1px solid var(--border2);border-radius:4px;color:var(--text-dim);cursor:pointer;font-size:15px;transition:all .12s;flex-shrink:0}
.dm-close:hover{color:var(--text);background:var(--surface3)}
.dm-body{overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:14px;flex:1}
.dm-body::-webkit-scrollbar{width:5px}
.dm-body::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px}
.dm-label{font-size:10.5px;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px}
.dm-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:4px}
.dm-field{padding:6px 8px;background:var(--surface3);border:1px solid var(--border);border-radius:4px}
.df-k{font-size:9.5px;color:var(--text-muted);font-family:var(--mono);text-transform:uppercase;letter-spacing:.05em;display:block;margin-bottom:2px}
.df-v{font-family:var(--mono);font-size:11.5px;color:var(--text);word-break:break-all}
.dm-summary{padding:10px 12px;background:var(--bg);border:1px solid var(--border2);border-radius:5px;font-family:var(--mono);font-size:12px;color:var(--text-dim);line-height:1.6}
.dm-foot{display:flex;gap:7px;padding:10px 16px;border-top:1px solid var(--border);flex-shrink:0;flex-wrap:wrap;position:relative;align-items:center}
.modal-tab-btn{padding:6px 14px;background:none;border:none;border-bottom:2px solid transparent;color:var(--text-dim);font-size:12.5px;font-family:var(--sans);cursor:pointer;transition:all .12s;margin-bottom:-1px}
.modal-tab-btn:hover{color:var(--text)}
.modal-tab-btn.active{color:var(--accent);border-bottom-color:var(--accent)}
.rm-btn{padding:5px 14px;background:var(--surface3);border:1px solid var(--border2);border-radius:5px;color:var(--text-dim);font-size:12px;cursor:pointer;transition:all .12s}
.rm-btn:hover{color:var(--text);border-color:var(--accent)}
.rm-btn.ok{color:var(--green);border-color:var(--green)}


/* ── TRIAGE STATUS BADGES ── */
.st-open{display:inline-flex;align-items:center;padding:1px 6px;border-radius:3px;font-family:var(--mono);font-size:10.5px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;color:#6b7280;border:1px solid #6b7280;background:rgba(107,114,128,.12)}
.st-investigating{display:inline-flex;align-items:center;padding:1px 6px;border-radius:3px;font-family:var(--mono);font-size:10.5px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;color:var(--yellow);border:1px solid var(--yellow);background:var(--yellow-dim)}
.st-resolved{display:inline-flex;align-items:center;padding:1px 6px;border-radius:3px;font-family:var(--mono);font-size:10.5px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;color:var(--green);border:1px solid var(--green);background:var(--green-dim)}

/* error state */
.sb-error{padding:12px;font-size:11px;color:var(--red)}
</style>
</head>
<body>
<div class="layout">

  <div id="nav-root"></div>

  <div class="main-wrap">
    <div class="topbar">
      <span class="topbar-title">Alerts</span>
    </div>

<!-- TOP AREA -->
<div class="top-area">
  <div class="search-bar">
    <div class="search-wrap">
      <svg class="search-icon" width="13" height="13" viewBox="0 0 13 13" fill="currentColor">
        <path d="M5.5 0a5.5 5.5 0 100 11A5.5 5.5 0 005.5 0zm-4 5.5a4 4 0 118 0 4 4 0 01-8 0zM9.94 9.03l2.53 2.53-1.06 1.06-2.53-2.53 1.06-1.06z"/>
      </svg>
      <input class="search-input" id="searchInput" type="text"
        placeholder="Search alerts… (rule name, IP, MITRE tactic…)"
        oninput="onInput(this.value)"
        onkeydown="if(event.key==='Enter')runSearch()"/>
      <button class="search-clear" id="searchClear" onclick="clearSearch()">✕</button>
    </div>
    <button class="search-btn" onclick="runSearch()">Search</button>
  </div>
  <div class="active-filters" id="activeFilters"></div>
</div>

<!-- BODY: sidebar + main -->
<div class="body-area">

  <!-- SIDEBAR -->
  <aside class="sidebar">
    <div class="sb-head">
      Filters
      <button class="sb-clear" onclick="clearAllFacets()" title="Clear all filters">Reset</button>
    </div>
    <div id="sidebarContent">
      <div style="padding:20px 12px;font-size:11px;color:var(--text-muted)">Loading…</div>
    </div>
  </aside>

  <!-- MAIN PANEL -->
  <div class="main-panel">

    <!-- Controls -->
    <div class="controls">
      <select class="ctrl-sel" id="limitSel" onchange="onLimit()">
        <option value="50">50 rows</option>
        <option value="100" selected>100 rows</option>
        <option value="250">250 rows</option>
        <option value="500">500 rows</option>
      </select>
      <button class="ctrl-btn" onclick="runSearch()">
        <svg width="11" height="11" viewBox="0 0 11 11" fill="currentColor"><path d="M4.6 0a4.6 4.6 0 100 9.2A4.6 4.6 0 004.6 0zm3.5 7.7l2.1 2.1-.8.8-2.1-2.1.8-.8z"/></svg>
        Refresh
      </button>
      <button class="ctrl-btn" onclick="exportCSV(event)">
        <svg width="11" height="11" viewBox="0 0 11 11" fill="currentColor"><path d="M5.5 7.5L2.5 4.5H4.5V1h2v3.5h2L5.5 7.5zM1 9.5v1h9v-1H1z"/></svg>
        Export CSV
      </button>
      <span style="position:relative">
        <button class="ctrl-btn" onclick="toggleSavedSearchDD()">
          <svg width="11" height="11" viewBox="0 0 11 11" fill="currentColor"><path d="M5.5 0l1.3 3.6H11L7.7 5.8l1.2 3.6-3.4-2.3L2 9.4l1.2-3.6L0 3.6h4.2z"/></svg>
          Saved Searches
        </button>
        <div id="savedSearchDD" style="display:none;position:absolute;top:30px;left:0;z-index:50;background:var(--surface);border:1px solid var(--border2);border-radius:6px;padding:8px;width:240px;box-shadow:0 4px 16px rgba(0,0,0,.4)">
          <div style="display:flex;gap:5px;margin-bottom:8px">
            <input id="ssName" placeholder="Name this search" style="flex:1;background:var(--bg);border:1px solid var(--border2);border-radius:4px;color:var(--text);font-size:11.5px;padding:4px 6px;outline:none">
            <button class="ctrl-btn" onclick="saveCurrentSearch()">Save</button>
          </div>
          <div id="savedSearchList" style="max-height:200px;overflow-y:auto"></div>
        </div>
      </span>
      <div class="ctrl-space"></div>
      <span class="result-info" id="resultInfo">—</span>
      <div class="pager">
        <button class="page-btn" id="prevBtn" onclick="goPage(-1)" disabled>‹</button>
        <span class="page-info" id="pageInfo">1 / 1</span>
        <button class="page-btn" id="nextBtn" onclick="goPage(1)" disabled>›</button>
      </div>
    </div>

    <!-- Table -->
    <div class="table-scroll">
      <table>
        <colgroup>
          <col class="col-exp"><col style="width:100px"><col class="col-time"><col class="col-rule">
          <col class="col-sev"><col class="col-ip"><col class="col-mitre">
          <col class="col-tech"><col class="col-sum">
        </colgroup>
        <thead><tr>
          <th></th><th>Status</th><th>Triggered</th><th>Rule</th>
          <th>Severity</th><th>Source IP</th><th>MITRE Tactic</th>
          <th>Technique</th><th>Summary</th>
        </tr></thead>
        <tbody id="tbody">
          <tr class="empty-row"><td colspan="9"><span class="spinner"></span>Loading…</td></tr>
        </tbody>
      </table>
    </div>
  </div><!-- /main-panel -->
</div><!-- /body-area -->

  </div><!-- /.main-wrap -->

</div><!-- /.layout -->

<!-- ALERT DETAIL MODAL -->
<div class="modal-bg" id="detailModal" onclick="onDetailBg(event)">
  <div class="detail-modal">
    <div class="dm-head">
      <div class="dm-title-wrap">
        <div class="dm-rule" id="dmRule"></div>
        <div class="dm-time" id="dmTime"></div>
      </div>
      <div id="dmSevBadge"></div>
      <button class="dm-close" onclick="closeDetail()">✕</button>
    </div>
    <!-- Tab navigation -->
    <div class="modal-tabs" style="display:flex;gap:0;border-bottom:1px solid var(--border);padding:0 1rem;flex-shrink:0">
      <button class="modal-tab-btn active" data-tab="alert" onclick="switchAlertTab('alert',this)">Alert</button>
      <button class="modal-tab-btn" data-tab="logs" onclick="switchAlertTab('logs',this)">Logs</button>
      <button class="modal-tab-btn" data-tab="rule" onclick="switchAlertTab('rule',this)">Rule</button>
    </div>
    <div class="dm-body">
      <!-- Alert tab panel (existing content) -->
      <div id="alertTabAlert">
        <div>
          <div class="dm-label">Summary</div>
          <div class="dm-summary" id="dmSummary"></div>
        </div>
        <div>
          <div class="dm-label">Alert Fields</div>
          <div class="dm-grid" id="dmGrid"></div>
        </div>
      </div>
      <!-- Logs tab panel -->
      <div id="alertTabLogs" style="display:none">
        <div id="logsTabContent"><div style="color:var(--text-muted);font-size:12.5px">Click Logs tab to load…</div></div>
      </div>
      <!-- Rule tab panel -->
      <div id="alertTabRule" style="display:none">
        <div id="ruleTabContent"><div style="color:var(--text-muted);font-size:12.5px">Click Rule tab to load…</div></div>
      </div>
    </div>
    <div class="dm-foot">
      <button class="rm-btn" id="dmCopyJSON" onclick="copyDetailJSON()">Copy as JSON</button>
      <div id="alertCaseLinkage" style="font-size:.82rem;display:flex;align-items:center;margin-left:.25rem;margin-right:auto"></div>
      <div id="alertEscalateButtons" style="display:flex;gap:.5rem;align-items:center">
        <button id="btnNewCase" class="rm-btn" onclick="showNewCaseForm()">New Case</button>
        <button id="btnAddToCase" class="rm-btn" onclick="toggleAddToCaseDropdown()">Add to Case</button>
        <button id="btnAddException" class="rm-btn" onclick="showAddExceptionForm()">Add Exception</button>
      </div>
      <!-- Inline new case form (hidden by default) -->
      <div id="newCaseForm" style="display:none;width:100%;padding:.75rem;border-top:1px solid var(--border);margin-top:.25rem">
        <div style="display:flex;flex-direction:column;gap:.5rem">
          <input id="newCaseTitle" style="width:100%;background:var(--bg);border:1px solid var(--border2);border-radius:4px;color:var(--text);font-family:var(--sans);font-size:12.5px;padding:5px 8px;outline:none" placeholder="Case title">
          <div style="display:flex;gap:.5rem;align-items:center">
            <select id="newCaseSeverity" style="background:var(--surface3);border:1px solid var(--border2);border-radius:4px;color:var(--text);font-size:12px;padding:3px 7px;height:26px;cursor:pointer;outline:none">
              <option value="low">Low</option>
              <option value="medium" selected>Medium</option>
              <option value="high">High</option>
              <option value="critical">Critical</option>
            </select>
            <button class="rm-btn" onclick="createCaseFromAlert()" style="color:var(--green);border-color:var(--green)">Create</button>
            <button class="rm-btn" onclick="document.getElementById('newCaseForm').style.display='none'">Cancel</button>
          </div>
        </div>
      </div>
      <!-- Inline add exception form (hidden by default) -->
      <div id="addExceptionForm" style="display:none;width:100%;padding:.75rem;border-top:1px solid var(--border);margin-top:.25rem">
        <div style="display:flex;flex-direction:column;gap:.5rem">
          <div style="font-size:.78rem;color:var(--text-muted)">Except this rule for a field/value — the rule engine will skip matching events entirely.</div>
          <div style="display:flex;gap:.5rem">
            <select id="excModalField" style="background:var(--surface3);border:1px solid var(--border2);border-radius:4px;color:var(--text);font-size:12px;padding:3px 7px;height:26px">
              <option value="source_ip">source_ip</option>
              <option value="source">source</option>
              <option value="method">method</option>
              <option value="uri">uri</option>
              <option value="status_code">status_code</option>
              <option value="response_size">response_size</option>
              <option value="user_agent">user_agent</option>
              <option value="referer">referer</option>
            </select>
            <input id="excModalValue" style="flex:1;background:var(--bg);border:1px solid var(--border2);border-radius:4px;color:var(--text);font-family:var(--sans);font-size:12.5px;padding:5px 8px;outline:none" placeholder="Value">
          </div>
          <input id="excModalReason" style="width:100%;background:var(--bg);border:1px solid var(--border2);border-radius:4px;color:var(--text);font-family:var(--sans);font-size:12.5px;padding:5px 8px;outline:none" placeholder="Reason (required)">
          <div style="display:flex;gap:.5rem;align-items:center">
            <button class="rm-btn" onclick="submitAddException()" style="color:var(--green);border-color:var(--green)">Add</button>
            <button class="rm-btn" onclick="document.getElementById('addExceptionForm').style.display='none'">Cancel</button>
          </div>
        </div>
      </div>
      <!-- Add to existing case dropdown -->
      <div id="addToCaseDropdown" style="display:none;position:absolute;bottom:3.5rem;right:1rem;background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:.5rem;width:280px;z-index:100;box-shadow:0 4px 16px rgba(0,0,0,.4)">
        <input id="caseSearchInput" oninput="filterCaseDropdown()" style="width:100%;margin-bottom:.5rem;background:var(--bg);border:1px solid var(--border2);border-radius:4px;color:var(--text);font-family:var(--sans);font-size:12px;padding:5px 8px;outline:none" placeholder="Search open cases…">
        <div id="caseDropdownList" style="max-height:200px;overflow-y:auto"></div>
      </div>
    </div>
  </div>
</div>

<script>
// ── STATE ──────────────────────────────────────────────────────────────
const S={
  ep:'http://localhost:8000', jwt:'',
  q:'',
  af:{},   // active facet filters {severity, rule_name}
  limit:100, offset:0, total:0, page:1,
  alerts:[], detailAl:null,
};

// ── THEME ──────────────────────────────────────────────────────────────
const TH=document.documentElement;
function applyTheme(t){
  TH.setAttribute('data-theme',t);
  localStorage.setItem('ts_theme',t);
}

// ── INIT ───────────────────────────────────────────────────────────────
(function init(){
  const theme=localStorage.getItem('ts_theme')||'dark';
  applyTheme(theme);
  S.jwt=localStorage.getItem('ts_jwt')||'';
  S.ep=localStorage.getItem('ts_ep')||'http://localhost:8000';
  if(!S.jwt){window.location.href='/ui/login.html';return}
  const _p=parseJwt(S.jwt);
  if(!_p||_p.exp*1000<Date.now()){clearAuth();window.location.href='/ui/login.html';return}
  hydrateFromURL();
  fetchFacets();
  fetchAlerts();
  document.getElementById('activeFilters').addEventListener('click',e=>{
    const btn=e.target.closest('.chip-rm[data-key]');
    if(btn) clickFacet(btn.dataset.key,btn.dataset.val);
  });
})();

// ── SEARCH ─────────────────────────────────────────────────────────────
function onInput(v){
  document.getElementById('searchClear').classList.toggle('show',v.length>0);
}
function clearSearch(){
  document.getElementById('searchInput').value='';
  document.getElementById('searchClear').classList.remove('show');
  S.q=''; S.offset=0; S.page=1;
  fetchAlerts();
}
function runSearch(){
  S.q=document.getElementById('searchInput').value.trim();
  S.offset=0; S.page=1;
  fetchAlerts();
}

// ── BUILD QUERY STRING ─────────────────────────────────────────────────
function buildQS(){
  const p=new URLSearchParams();
  p.set('limit',S.limit);
  p.set('offset',S.offset);
  if(S.q) p.set('q',S.q);
  if(S.af.severity) p.set('severity',S.af.severity);
  if(S.af.rule_name) p.set('rule_name',S.af.rule_name);
  return p.toString();
}
function hydrateFromURL(){
  const params=new URLSearchParams(window.location.search);
  if(![...params.keys()].length)return false;
  if(params.has('q')){S.q=params.get('q');document.getElementById('searchInput').value=S.q;}
  if(params.has('severity'))S.af.severity=params.get('severity');
  if(params.has('rule_name'))S.af.rule_name=params.get('rule_name');
  if(params.has('limit')){S.limit=parseInt(params.get('limit'),10)||S.limit;document.getElementById('limitSel').value=String(S.limit);}
  if(params.has('offset'))S.offset=parseInt(params.get('offset'),10)||0;
  S.page=Math.floor(S.offset/S.limit)+1;
  renderChips();
  return true;
}
function serializeCurrentURL(){
  const qs=buildQS();
  history.replaceState(null,'',window.location.pathname+'?'+qs);
}

// ── API ────────────────────────────────────────────────────────────────
async function api(path){
  const res=await fetch(S.ep+path,{headers:{Authorization:`Bearer ${S.jwt}`}});
  if(res.status===401){clearAuth();window.location.href='/ui/login.html';return null}
  if(!res.ok) throw new Error(`HTTP ${res.status}`);
  return res.json();
}

// ── FETCH ALERTS ───────────────────────────────────────────────────────
async function fetchAlerts(){
  const tbody=document.getElementById('tbody');
  tbody.innerHTML='<tr class="empty-row"><td colspan="9"><span class="spinner"></span>Loading…</td></tr>';
  serializeCurrentURL();
  try{
    const d=await api(`/alerts?${buildQS()}`);
    if(!d) return;
    S.total=d.total; S.alerts=d.alerts;
    renderTable(d.alerts);
    updatePager();
    renderChips();
  }catch(e){
    tbody.innerHTML=`<tr class="empty-row"><td colspan="8" style="color:var(--red)">Error: ${e.message}</td></tr>`;
  }
}

// ── FETCH FACETS ───────────────────────────────────────────────────────
async function fetchFacets(){
  try{
    const d=await api('/alerts/facets');
    if(!d) return;
    buildSidebar(d);
  }catch(e){
    document.getElementById('sidebarContent').innerHTML=
      `<div class="sb-error">Could not load facets: ${e.message}</div>`;
  }
}

// ── SIDEBAR ────────────────────────────────────────────────────────────
const SEV_ORDER=['critical','high','medium','low'];

function buildSidebar(d){
  const sc=document.getElementById('sidebarContent');
  sc.innerHTML='';
  sc.appendChild(makeFacetGroup('Severity','severity',d.severity,'dot-'+'{v}'));
  sc.appendChild(makeFacetGroup('Rule','rule_name',d.rule_name,'dot-rule'));
}

function dotClass(field,value){
  if(field==='severity') return 'dot-'+(value||'unknown').toLowerCase();
  return 'dot-rule';
}

function makeFacetGroup(title,field,items,_dotClass){
  const max=Math.max(1,...(items||[]).map(i=>i.count));
  const g=document.createElement('div');
  g.className='facet-group open';
  g.innerHTML=`<div class="facet-hdr" onclick="toggleFacet(this.parentElement)">
    <span class="facet-title">${title}</span>
    <span class="facet-chevron">▼</span>
  </div>`;
  const body=document.createElement('div');
  body.className='facet-body';
  if(!items||!items.length){
    body.innerHTML='<div class="facet-empty">No data</div>';
  } else {
    (items).forEach(it=>{
      const isActive=S.af[field]===it.value;
      const pct=Math.round(it.count/max*100);
      const dc=dotClass(field,it.value);
      const row=document.createElement('div');
      row.className='fv'+(isActive?' active':'');
      row.onclick=()=>clickFacet(field,it.value);
      row.innerHTML=`<div class="fv-dot ${dc}"></div>
        <div class="fv-inner">
          <div style="display:flex;align-items:center;gap:4px">
            <span class="fv-label">${esc(it.value)}</span>
            <span class="fv-count">${it.count}</span>
          </div>
          <div class="fv-bar-wrap"><div class="fv-bar ${dc}" style="width:${pct}%"></div></div>
        </div>`;
      body.appendChild(row);
    });
  }
  g.appendChild(body);
  return g;
}

function toggleFacet(grp){grp.classList.toggle('open')}

function clickFacet(field,value){
  if(S.af[field]===value) delete S.af[field];
  else S.af[field]=value;
  S.offset=0; S.page=1;
  fetchAlerts();
  fetchFacets();
  renderChips();
}

function clearAllFacets(){
  S.af={};
  S.offset=0; S.page=1;
  fetchAlerts();
  fetchFacets();
  renderChips();
}

// ── ACTIVE FILTER CHIPS ────────────────────────────────────────────────
function renderChips(){
  const el=document.getElementById('activeFilters');
  el.innerHTML='';
  Object.entries(S.af).forEach(([k,v])=>{
    const chip=document.createElement('span');
    chip.className='filter-chip';
    chip.innerHTML=`<b>${esc(k)}:</b>&nbsp;${esc(v)}<button class="chip-rm" data-key="${esc(k)}" data-val="${esc(v)}">✕</button>`;
    el.appendChild(chip);
  });
  if(S.q){
    const chip=document.createElement('span');
    chip.className='filter-chip';
    chip.innerHTML=`<b>search:</b>&nbsp;${esc(S.q)}<button class="chip-rm" onclick="clearSearch()">✕</button>`;
    el.appendChild(chip);
  }
}

// ── RENDER TABLE ───────────────────────────────────────────────────────
function renderTable(alerts){
  const tbody=document.getElementById('tbody');
  if(!alerts.length){
    tbody.innerHTML='<tr class="empty-row"><td colspan="9">No alerts found</td></tr>';
    return;
  }
  tbody.innerHTML='';
  alerts.forEach((al,i)=>{
    const tr=document.createElement('tr');
    tr.className='dr';
    tr.dataset.ai=i;
    tr.onclick=()=>toggleExpand(tr,al,i);
    const t=fmtTime(al.triggered_at);
    tr.innerHTML=`
      <td><span style="color:var(--text-muted);font-size:10px">▶</span></td>
      <td>${statusBadge(al.status)}</td>
      <td><span style="font-family:var(--mono);font-size:11.5px">${t}</span></td>
      <td style="font-family:var(--mono);font-size:12px">${esc(al.rule_name||'—')}</td>
      <td>${sevBadge(al.severity)}</td>
      <td>${ipLink(al.source_ip)}</td>
      <td><span style="font-size:12px">${esc(al.mitre_tactic||'—')}</span></td>
      <td>${al.mitre_technique?`<span class="mbadge">${esc(al.mitre_technique)}</span>`:'<span style="color:var(--text-muted)">—</span>'}</td>
      <td style="color:var(--text-dim);font-size:12px">${esc((al.summary||'').slice(0,100))}</td>`;
    tbody.appendChild(tr);
  });
}

// ── EXPAND ROW ─────────────────────────────────────────────────────────
let _openTr=null;
function toggleExpand(tr,al,i){
  if(_openTr){
    const prev=_openTr;
    const prevExp=prev.nextSibling;
    if(prevExp&&prevExp.classList.contains('expand-row')){prevExp.remove();}
    prev.classList.remove('open');
    prev.querySelector('td:first-child span').textContent='▶';
    _openTr=null;
    if(prev===tr) return;
  }
  tr.classList.add('open');
  tr.querySelector('td:first-child span').textContent='▼';
  _openTr=tr;
  const exp=document.createElement('tr');
  exp.className='expand-row';
  const showFields=['alert_id','triggered_at','rule_name','severity','mitre_tactic','mitre_technique','source_ip','event_id'];
  const fieldRows=showFields.map(k=>`
    <div class="ef">
      <span class="ef-k">${k}</span>
      <span class="ef-v">${k==='source_ip'?ipLink(al[k]):esc(al[k]||'—')}</span>
    </div>`).join('');
  const curStatus=al.status||'open';
  const optOpen=curStatus==='open'?'selected':'';
  const optInv=curStatus==='investigating'?'selected':'';
  const optRes=curStatus==='resolved'?'selected':'';
  exp.innerHTML=`<td colspan="9"><div class="exp-body">
    <div class="exp-grid">${fieldRows}</div>
    <div style="display:flex;gap:7px;margin-top:8px;flex-wrap:wrap">
      <button class="ctrl-btn" onclick="openDetail(${i})">View Full Detail</button>
      <button class="ctrl-btn" id="aiBtn_${i}" onclick="event.stopPropagation();explainAlert('${esc(al.alert_id)}',${i})">✦ Explain with AI</button>
      <button class="ctrl-btn" onclick="event.stopPropagation();openDetail(${i});showNewCaseForm()">New Case</button>
      <button class="ctrl-btn" onclick="event.stopPropagation();openDetail(${i});toggleAddToCaseDropdown()">Add to Case</button>
    </div>
    <div id="aiResult_${i}" style="display:none;margin-top:10px;padding:10px 14px;background:var(--surface3);border:1px solid var(--border2);border-radius:5px;font-size:12.5px;line-height:1.65;color:var(--text)"></div>
    <div style="margin-top:12px;padding-top:12px;border-top:1px solid var(--border)">
      <div style="font-size:10px;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px">Triage</div>
      <div style="display:flex;align-items:flex-start;gap:10px;flex-wrap:wrap">
        <div>
          <div style="font-size:11px;color:var(--text-muted);margin-bottom:4px">Status</div>
          <select id="trStatus_${i}" class="ctrl-sel" style="width:140px">
            <option value="open" ${optOpen}>Open</option>
            <option value="investigating" ${optInv}>Investigating</option>
            <option value="resolved" ${optRes}>Resolved</option>
          </select>
        </div>
        <div style="min-width:130px">
          <div style="font-size:11px;color:var(--text-muted);margin-bottom:4px">Assigned to</div>
          <input id="trAssigned_${i}" type="text" class="ctrl-sel" style="width:100%;height:28px;padding:3px 7px" value="${esc(al.assigned_to||'')}" placeholder="username">
        </div>
      </div>
      <button id="trSaveBtn_${i}" class="ctrl-btn" style="margin-top:8px" onclick="event.stopPropagation();saveTriage('${esc(al.alert_id)}',${i})">Save Triage</button>
    </div>
  </div></td>`;
  tr.parentNode.insertBefore(exp,tr.nextSibling);
}

// ── DETAIL MODAL ───────────────────────────────────────────────────────
function openDetail(i){
  const al=S.alerts[i];
  if(!al) return;
  S.detailAl=al;
  _modalAlert=al;
  _logsLoaded=false;
  _ruleLoaded=false;
  _ruleCache={};
  document.getElementById('dmRule').textContent=al.rule_name||'Unknown Rule';
  document.getElementById('dmTime').textContent=fmtTime(al.triggered_at);
  document.getElementById('dmSevBadge').innerHTML=sevBadge(al.severity);
  document.getElementById('dmSummary').textContent=al.summary||'—';
  const grid=document.getElementById('dmGrid');
  const skip=['summary'];
  grid.innerHTML=Object.entries(al)
    .filter(([k])=>!skip.includes(k))
    .map(([k,v])=>`<div class="dm-field">
      <span class="df-k">${esc(k)}</span>
      <span class="df-v">${k==='source_ip'&&v?ipLink(v):esc(v!=null?String(v):'—')}</span>
    </div>`).join('');
  document.getElementById('addToCaseDropdown').style.display='none';
  document.getElementById('newCaseForm').style.display='none';
  document.getElementById('addExceptionForm').style.display='none';
  switchAlertTab('alert',document.querySelector('.modal-tab-btn[data-tab="alert"]'));
  loadAlertCaseLinkage(al.alert_id);
  document.getElementById('detailModal').classList.add('show');
}
function closeDetail(){
  document.getElementById('detailModal').classList.remove('show');
  document.getElementById('addToCaseDropdown').style.display='none';
  document.getElementById('newCaseForm').style.display='none';
  document.getElementById('addExceptionForm').style.display='none';
}
function onDetailBg(e){if(e.target.id==='detailModal') closeDetail()}
function copyDetailJSON(){
  navigator.clipboard.writeText(JSON.stringify(S.detailAl,null,2));
  const btn=document.getElementById('dmCopyJSON');
  btn.textContent='Copied!'; btn.classList.add('ok');
  setTimeout(()=>{btn.textContent='Copy as JSON';btn.classList.remove('ok')},1800);
}

// ── SEVERITY BADGE ─────────────────────────────────────────────────────
function sevBadge(sev){
  const s=(sev||'unknown').toLowerCase();
  return `<span class="badge sev-${s}">${esc(s)}</span>`;
}

// ── STATUS BADGE ────────────────────────────────────────────────────────
function statusBadge(st){
  const s=(st||'open').toLowerCase();
  const label={'open':'open','investigating':'invstg','resolved':'resolved'}[s]||s;
  return `<span class="st-${s}">${esc(label)}</span>`;
}

// ── SAVE TRIAGE ─────────────────────────────────────────────────────────
async function saveTriage(alertId,i){
  const statusEl=document.getElementById('trStatus_'+i);
  const assignedEl=document.getElementById('trAssigned_'+i);
  const btn=document.getElementById('trSaveBtn_'+i);
  if(!statusEl||!btn) return;
  btn.textContent='Saving…';
  try{
    const res=await fetch(S.ep+'/alerts/'+alertId,{
      method:'PATCH',
      headers:{Authorization:'Bearer '+S.jwt,'Content-Type':'application/json'},
      body:JSON.stringify({status:statusEl.value,assigned_to:assignedEl.value}),
    });
    if(res.ok){
      const updated=await res.json();
      if(S.alerts[i]) S.alerts[i]=updated;
      const row=document.querySelector('tr.dr[data-ai="'+i+'"]');
      if(row) row.cells[1].innerHTML=statusBadge(updated.status);
      btn.textContent='Saved ✓'; btn.style.color='var(--green)';
      setTimeout(()=>{btn.textContent='Save Triage';btn.style.color=''},2000);
    } else {
      btn.textContent='Error'; btn.style.color='var(--red)';
      setTimeout(()=>{btn.textContent='Save Triage';btn.style.color=''},2000);
    }
  }catch(_){
    btn.textContent='Error'; btn.style.color='var(--red)';
    setTimeout(()=>{btn.textContent='Save Triage';btn.style.color=''},2000);
  }
}

// ── PAGER ──────────────────────────────────────────────────────────────
function updatePager(){
  const pages=Math.max(1,Math.ceil(S.total/S.limit));
  document.getElementById('pageInfo').textContent=`${S.page} / ${pages}`;
  document.getElementById('prevBtn').disabled=S.page<=1;
  document.getElementById('nextBtn').disabled=S.page>=pages;
  const start=S.offset+1, end=Math.min(S.offset+S.limit,S.total);
  document.getElementById('resultInfo').innerHTML=
    S.total===0?'No alerts':`<b>${start}–${end}</b> of <b>${S.total}</b> alerts`;
}
function goPage(d){
  const pages=Math.max(1,Math.ceil(S.total/S.limit));
  S.page=Math.max(1,Math.min(pages,S.page+d));
  S.offset=(S.page-1)*S.limit;
  fetchAlerts();
}
function onLimit(){
  S.limit=parseInt(document.getElementById('limitSel').value,10);
  S.offset=0; S.page=1;
  fetchAlerts();
}

// ── EXPORT CSV ─────────────────────────────────────────────────────────
async function exportCSV(evt){
  const btn=evt?.currentTarget;
  const orig=btn?btn.innerHTML:null;
  const qs=buildQS();
  try{
    const r=await fetch(`${S.ep}/alerts?${qs}&format=csv`,{headers:{Authorization:`Bearer ${S.jwt}`}});
    if(!r.ok)throw new Error(`HTTP ${r.status}`);
    const blob=await r.blob();
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');a.href=url;a.download='tinysiem_alerts.csv';a.click();
    URL.revokeObjectURL(url);
  }catch(e){
    console.error('CSV export failed:',e);
    if(btn){btn.innerHTML='Export failed';setTimeout(()=>{btn.innerHTML=orig},2000);}
  }
}

// ── SAVED SEARCHES ─────────────────────────────────────────────────────
let _savedSearches=[];
function toggleSavedSearchDD(){
  const dd=document.getElementById('savedSearchDD');
  if(dd.style.display!=='none'){dd.style.display='none';return}
  dd.style.display='block';
  loadSavedSearches();
}
async function loadSavedSearches(){
  const listEl=document.getElementById('savedSearchList');
  listEl.innerHTML='<div style="color:var(--text-muted);font-size:11px;padding:4px">Loading…</div>';
  try{
    const d=await api('/searches?page=alerts');
    if(!d)return;
    _savedSearches=d.searches||[];
    renderSavedSearchList();
  }catch(e){
    listEl.innerHTML=`<div style="color:var(--red);font-size:11px;padding:4px">${esc(e.message)}</div>`;
  }
}
function renderSavedSearchList(){
  const listEl=document.getElementById('savedSearchList');
  if(!_savedSearches.length){
    listEl.innerHTML='<div style="color:var(--text-muted);font-size:11px;padding:4px">No saved searches</div>';
    return;
  }
  listEl.innerHTML=_savedSearches.map(s=>`
    <div style="display:flex;align-items:center;gap:6px;padding:4px 2px">
      <span class="ss-run" data-id="${esc(s.id)}" style="flex:1;font-size:12px;cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${esc(s.query_string)}">${esc(s.name)}</span>
      <button class="chip-rm ss-del" data-id="${esc(s.id)}" title="Delete">✕</button>
    </div>`).join('');
}
function runSavedSearch(id){
  const s=_savedSearches.find(x=>x.id===id);
  if(!s)return;
  window.location.href='/ui/alerts.html?'+s.query_string;
}
async function deleteSavedSearch(id){
  try{
    await apiFetch(`/searches/${id}`,{method:'DELETE'});
    _savedSearches=_savedSearches.filter(s=>s.id!==id);
    renderSavedSearchList();
  }catch(e){/* best-effort */}
}
async function saveCurrentSearch(){
  const nameInput=document.getElementById('ssName');
  const name=nameInput.value.trim();
  if(!name)return;
  const qs=buildQS();
  try{
    const r=await apiFetch('/searches',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({name,page:'alerts',query_string:qs}),
    });
    if(r&&r.ok){nameInput.value='';loadSavedSearches();}
  }catch(e){/* best-effort */}
}
// ── SAVED SEARCH LIST EVENT DELEGATION ─────────────────────────────────
document.getElementById('savedSearchList').addEventListener('click',function(e){
  const run=e.target.closest('.ss-run');
  if(run){runSavedSearch(run.dataset.id);return}

// ── UTILS ──────────────────────────────────────────────────────────────
function esc(s){
  if(s==null) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
function ipLink(ip){
  if(!ip)return '—';
  return `<a href="/ui/entity.html?ip=${encodeURIComponent(ip)}" onclick="event.stopPropagation()" style="color:var(--accent);text-decoration:none;font-family:var(--mono)" title="View entity">${esc(ip)}</a>`;
}
function fmtTime(ts){
  if(!ts) return '—';
  try{
    const d=new Date(ts.endsWith('Z')||ts.includes('+')?ts:ts+'Z');
    const pad=n=>String(n).padStart(2,'0');
    return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} `+
           `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
  }catch{return ts}
}

// ── AI EXPLAIN ─────────────────────────────────────────────────────────
async function explainAlert(alertId, i){
  const btn=document.getElementById('aiBtn_'+i);
  const result=document.getElementById('aiResult_'+i);
  if(!btn||!result) return;
  btn.textContent='✦ Thinking…'; btn.disabled=true;
  result.style.display='none';
  try{
    const r=await fetch(`${S.ep}/ai/explain-alert`,{
      method:'POST',
      headers:{Authorization:`Bearer ${S.jwt}`,'Content-Type':'application/json'},
      body:JSON.stringify({alert_id:alertId}),
    });
    const d=await r.json();
    if(!r.ok){
      result.innerHTML=`<span style="color:var(--red)">Error: ${esc(d.detail||'Unknown error')}</span>`;
    } else {
      result.innerHTML=
        '<div style="font-size:10px;font-weight:600;color:var(--accent);text-transform:uppercase;letter-spacing:.07em;margin-bottom:6px">✦ AI Analysis</div>'+
        esc(d.explanation).replace(/\n\n/g,'</p><p style="margin-top:8px">').replace(/\n/g,'<br>');
    }
    result.style.display='block';
  }catch(e){
    result.innerHTML=`<span style="color:var(--red)">Error: ${esc(e.message)}</span>`;
    result.style.display='block';
  }finally{
    btn.textContent='✦ Explain with AI'; btn.disabled=false;
  }
}

// ── MODAL API HELPER (returns Response, not parsed JSON) ──────────────────────
async function apiFetch(path, opts={}) {
  const headers={Authorization:`Bearer ${S.jwt}`,...(opts.headers||{})};
  const res=await fetch(S.ep+path,{...opts,headers});
  if(res.status===401){clearAuth();window.location.href='/ui/login.html';return null}
  return res;
}

// ── TOAST ─────────────────────────────────────────────────────────────────────
function showToast(msg,type){
  let t=document.getElementById('_toast');
  if(!t){
    t=document.createElement('div');
    t.id='_toast';
    t.style.cssText='position:fixed;bottom:24px;left:50%;transform:translateX(-50%);padding:8px 18px;border-radius:6px;font-size:13px;z-index:9999;transition:opacity .4s;white-space:nowrap';
    document.body.appendChild(t);
  }
  t.innerHTML=msg;
  t.style.background=type==='error'?'var(--red-dim)':'var(--surface4)';
  t.style.color=type==='error'?'var(--red)':'var(--green)';
  t.style.border=type==='error'?'1px solid var(--red)':'1px solid var(--green)';
  t.style.opacity='1';
  clearTimeout(t._to);
  t._to=setTimeout(()=>{t.style.opacity='0'},3500);
}

// ── ALERT MODAL STATE ─────────────────────────────────────────────────────────
let _modalAlert=null;
let _ruleCache={};
let _logsLoaded=false;
let _ruleLoaded=false;

function switchAlertTab(tab,btn){
  ['alert','logs','rule'].forEach(t=>{
    document.getElementById('alertTab'+t.charAt(0).toUpperCase()+t.slice(1)).style.display=t===tab?'':'none';
  });
  document.querySelectorAll('.modal-tab-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  if(tab==='logs'&&!_logsLoaded){_logsLoaded=true;loadLogsTab();}
  if(tab==='rule'&&!_ruleLoaded){_ruleLoaded=true;loadRuleTab();}
}

async function loadLogsTab(){
  const el=document.getElementById('logsTabContent');
  el.innerHTML='<div style="color:var(--text-muted);font-size:12.5px">Loading…</div>';
  const alert=_modalAlert;
  if(!alert) return;
  const rule=await fetchRule(alert.rule_name);
  const condType=rule?.condition?.type||'field_match';

  if(condType==='field_match'&&alert.event_id){
    try{
      const resp=await apiFetch('/events/'+encodeURIComponent(alert.event_id));
      if(!resp) return;
      if(resp.status===404){
        el.innerHTML='<div style="color:var(--text-muted);font-size:12.5px">Event '+esc(alert.event_id)+' is no longer in the database (may have been archived).</div>';
        return;
      }
      if(!resp.ok) throw new Error('HTTP '+resp.status);
      const ev=await resp.json();
      let html='<pre style="white-space:pre-wrap;word-break:break-all;font-size:.78rem;background:var(--surface3);border:1px solid var(--border);padding:.75rem;border-radius:4px;margin-bottom:.75rem">'+esc(ev.raw||'')+'</pre>';
      html+='<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:.5rem">';
      for(const [k,v] of Object.entries(ev)){
        if(k==='raw'||v===null||v===undefined) continue;
        html+='<div style="background:var(--surface3);border:1px solid var(--border);border-radius:4px;padding:.5rem"><div style="font-size:.65rem;font-weight:600;letter-spacing:.06em;color:var(--text-muted);text-transform:uppercase">'+esc(k)+'</div><div style="font-family:var(--mono);font-size:.82rem;word-break:break-all">'+esc(String(v))+'</div></div>';
      }
      html+='</div>';
      el.innerHTML=html;
    }catch(e){
      el.innerHTML='<div style="color:var(--red);font-size:12.5px">Failed to load event: '+esc(String(e))+'</div>';
    }
  } else {
    const cond=rule?.condition||{};
    const windowSec=cond.window_seconds||60;
    const firedAt=alert.triggered_at?new Date(alert.triggered_at):new Date();
    const startTs=new Date(firedAt.getTime()-windowSec*1000).toISOString();
    const endTs=new Date(firedAt.getTime()+windowSec*1000).toISOString();
    const params=new URLSearchParams();
    if(alert.source_ip) params.set('source_ip',alert.source_ip);
    params.set('start',startTs);
    params.set('end',endTs);
    const fieldMap={status_code:'status_code',source_ip:'source_ip',uri:'uri',method:'method'};
    const condField=cond.field||'';
    const condValue=String(cond.value||'');
    if(fieldMap[condField]) params.set(fieldMap[condField],condValue);
    else if(condValue) params.set('q',condValue);
    const eventsUrl='/ui/events.html?'+params.toString();
    let summary='';
    if(condType==='threshold'){
      summary='Condition: '+esc(condField)+' '+esc(cond.operator||'eq')+' '+esc(condValue)+' · '+esc(String(cond.threshold_count||'?'))+'+ hits in '+esc(String(windowSec))+'s · source: '+esc(alert.source||rule?.source||'?');
    } else {
      summary='Multi-step correlation over '+esc(String(windowSec))+'s';
    }
    el.innerHTML=
      '<div style="background:var(--surface3);border:1px solid var(--border);border-radius:6px;padding:.75rem;margin-bottom:.75rem;font-size:.83rem">'+
        '<div style="color:var(--text-muted);margin-bottom:.25rem">This rule fired on a window of events, not a single log.</div>'+
        '<div>'+summary+'</div>'+
        '<div style="margin-top:.25rem;color:var(--text-muted)">Time window: '+esc(new Date(firedAt.getTime()-windowSec*1000).toLocaleString())+' → '+esc(new Date(firedAt.getTime()+windowSec*1000).toLocaleString())+'</div>'+
        (alert.source_ip?'<div style="color:var(--text-muted)">Source IP: '+esc(alert.source_ip)+'</div>':'')+
      '</div>'+
      '<a href="'+esc(eventsUrl)+'" class="rm-btn" style="display:inline-block;text-decoration:none">View triggering logs →</a>';
  }
}

async function fetchRule(ruleName){
  if(!ruleName) return null;
  if(_ruleCache[ruleName]) return _ruleCache[ruleName];
  try{
    const resp=await apiFetch('/rules/'+encodeURIComponent(ruleName));
    if(!resp||!resp.ok) return null;
    const data=await resp.json();
    // Parse yaml_text into a structured object for callers that need condition/source/mitre fields
    const yaml=data.yaml_text||'';
    const rule={name:data.name,yaml_text:yaml};
    const condMatch=yaml.match(/^condition:\s*\n((?:[ \t]+.+\n?)*)/m);
    if(condMatch){
      const condBlock=condMatch[1];
      rule.condition={
        type:(condBlock.match(/type:\s*(\S+)/)||[])[1]||'field_match',
        field:(condBlock.match(/field:\s*(\S+)/)||[])[1],
        value:(condBlock.match(/value:\s*(.+)/)||[])[1]?.trim(),
        operator:(condBlock.match(/operator:\s*(\S+)/)||[])[1],
        threshold_count:parseInt((condBlock.match(/threshold_count:\s*(\d+)/)||[])[1])||null,
        window_seconds:parseInt((condBlock.match(/window_seconds:\s*(\d+)/)||[])[1])||null,
        steps:null,
      };
    }
    rule.source=(yaml.match(/^source:\s*(\S+)/m)||[])[1];
    rule.mitre_tactic=(yaml.match(/^mitre_tactic:\s*["']?([^"'\n]+)["']?/m)||[])[1]?.trim();
    rule.mitre_technique=(yaml.match(/^mitre_technique:\s*["']?([^"'\n]+)["']?/m)||[])[1]?.trim();
    if(rule.condition&&yaml.includes('type: correlation')){
      rule.condition.type='correlation';
    }
    _ruleCache[ruleName]=rule;
    return rule;
  }catch{return null}
}

async function loadRuleTab(){
  const el=document.getElementById('ruleTabContent');
  el.innerHTML='<div style="color:var(--text-muted);font-size:12.5px">Loading…</div>';
  const rule=await fetchRule(_modalAlert?.rule_name);
  if(!rule){
    el.innerHTML='<div style="color:var(--text-muted);font-size:12.5px">Rule definition not available — rule may have been deleted after this alert fired.</div>';
    return;
  }
  const cond=rule.condition||{};
  let condSummary='';
  if(cond.type==='field_match'){
    condSummary='Fires when <code>'+esc(cond.field)+'</code> '+esc(cond.operator)+' <code>'+esc(String(cond.value))+'</code> on source <code>'+esc(rule.source)+'</code>';
  } else if(cond.type==='threshold'){
    condSummary='Fires when <code>'+esc(cond.field)+'</code> '+esc(cond.operator)+' <code>'+esc(String(cond.value))+'</code> appears '+esc(String(cond.threshold_count||'?'))+'+ times in '+esc(String(cond.window_seconds||'?'))+'s from the same source IP';
  } else if(cond.type==='correlation'){
    const stepDescs=(cond.steps||[]).map(s=>esc(s.field)+' '+esc(s.operator)+' '+esc(String(s.value))).join(' → ');
    condSummary='Fires on a multi-step sequence: '+stepDescs+' within '+esc(String(cond.window_seconds||'?'))+'s';
  }
  const mitreChips=[rule.mitre_tactic,rule.mitre_technique].filter(Boolean)
    .map(v=>'<span style="display:inline-block;background:var(--surface3);border:1px solid var(--border2);border-radius:4px;padding:.15rem .4rem;font-size:.73rem;margin-right:.25rem;color:var(--purple)">'+esc(v)+'</span>').join('');
  let html='<div style="margin-bottom:.75rem;font-size:.88rem;line-height:1.6">'+condSummary+'</div>';
  if(mitreChips) html+='<div style="margin-bottom:.75rem">'+mitreChips+'</div>';
  html+='<details style="margin-top:.75rem"><summary style="cursor:pointer;font-size:.78rem;color:var(--text-muted)">Raw YAML / JSON</summary><pre style="font-size:.75rem;background:var(--surface3);border:1px solid var(--border);padding:.75rem;border-radius:4px;margin-top:.5rem;white-space:pre-wrap;word-break:break-all">'+esc(rule.yaml_text||JSON.stringify(rule,null,2))+'</pre></details>';
  el.innerHTML=html;
}

// ── CASE ESCALATION ───────────────────────────────────────────────────────────
async function loadAlertCaseLinkage(alertId){
  const el=document.getElementById('alertCaseLinkage');
  el.innerHTML='';
  try{
    const resp=await apiFetch('/alerts/'+encodeURIComponent(alertId)+'/cases');
    if(!resp||!resp.ok) return;
    const data=await resp.json();
    if(data.cases&&data.cases.length>0){
      if(data.cases.length===1){
        const c=data.cases[0];
        el.innerHTML='<a href="/ui/cases.html?case_id='+esc(c.case_id)+'" style="font-size:.82rem;color:var(--accent)">In case: '+esc(c.title)+' →</a>';
      } else {
        el.innerHTML='<span style="font-size:.82rem;color:var(--text-dim)">In '+data.cases.length+' cases</span>';
      }
      document.getElementById('btnNewCase').style.display='none';
      document.getElementById('btnAddToCase').textContent='Add to another case';
    } else {
      document.getElementById('btnNewCase').style.display='';
    }
  }catch(e){/* silently fail — escalation still available */}
}

function showNewCaseForm(){
  const form=document.getElementById('newCaseForm');
  form.style.display=form.style.display==='none'?'':'none';
  if(_modalAlert&&form.style.display!=='none'){
    document.getElementById('newCaseTitle').value='Alert: '+(_modalAlert.rule_name||'')+' from '+(_modalAlert.source_ip||'unknown');
    document.getElementById('newCaseSeverity').value=_modalAlert.severity||'medium';
  }
}

function showAddExceptionForm(){
  const form=document.getElementById('addExceptionForm');
  form.style.display=form.style.display==='none'?'':'none';
  if(_modalAlert&&form.style.display!=='none'){
    document.getElementById('excModalField').value='source_ip';
    document.getElementById('excModalValue').value=_modalAlert.source_ip||'';
    document.getElementById('excModalReason').value='';
  }
}
async function submitAddException(){
  if(!_modalAlert||!_modalAlert.rule_name){showToast('This alert has no associated rule','error');return}
  const field=document.getElementById('excModalField').value;
  const value=document.getElementById('excModalValue').value.trim();
  const reason=document.getElementById('excModalReason').value.trim();
  if(!value||!reason){showToast('Value and reason are required','error');return}
  try{
    const r=await apiFetch('/rules/'+encodeURIComponent(_modalAlert.rule_name)+'/exceptions',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({field,value,reason}),
    });
    if(!r||!r.ok){
      const err=r?await r.json().catch(()=>({})):{};
      showToast('Failed to add exception: '+(err.detail||'error'),'error');
      return;
    }
    document.getElementById('addExceptionForm').style.display='none';
    showToast('Exception added for '+esc(_modalAlert.rule_name));
  }catch(e){
    showToast('Error: '+esc(e.message),'error');
  }
}

async function createCaseFromAlert(){
  const title=document.getElementById('newCaseTitle').value.trim();
  const severity=document.getElementById('newCaseSeverity').value;
  if(!title){showToast('Title is required','error');return}
  try{
    const cr=await apiFetch('/cases',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({title,severity}),
    });
    if(!cr||!cr.ok){showToast('Failed to create case','error');return}
    const newCase=await cr.json();
    const linkResp=await apiFetch('/cases/'+newCase.case_id+'/alerts',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({alert_ids:[_modalAlert.alert_id]}),
    });
    document.getElementById('newCaseForm').style.display='none';
    if(!linkResp||!linkResp.ok){
      showToast('Case created but alert could not be linked — open the case to link manually.');
    } else {
      showToast('Case created — <a href="/ui/cases.html?case_id='+esc(newCase.case_id)+'" style="color:var(--accent)">View Case</a>');
    }
    loadAlertCaseLinkage(_modalAlert.alert_id);
  }catch(e){
    showToast('Error: '+esc(e.message),'error');
  }
}

let _openCases=[];
async function toggleAddToCaseDropdown(){
  const dd=document.getElementById('addToCaseDropdown');
  if(dd.style.display!=='none'){dd.style.display='none';return}
  dd.style.display='';
  const listEl=document.getElementById('caseDropdownList');
  listEl.innerHTML='<div style="color:var(--text-muted);font-size:12px;padding:4px">Loading…</div>';
  try{
    const resp=await apiFetch('/cases?status=open&limit=20');
    if(!resp||!resp.ok) throw new Error('Failed to load cases');
    const data=await resp.json();
    _openCases=data.cases||[];
    renderCaseDropdown(_openCases);
  }catch(e){
    listEl.innerHTML='<div style="color:var(--red);font-size:12px;padding:4px">'+esc(String(e))+'</div>';
  }
}

function filterCaseDropdown(){
  const q=document.getElementById('caseSearchInput').value.toLowerCase();
  renderCaseDropdown(_openCases.filter(c=>c.title.toLowerCase().includes(q)));
}

function renderCaseDropdown(cases){
  const el=document.getElementById('caseDropdownList');
  if(!cases.length){el.innerHTML='<div style="color:var(--text-muted);font-size:12px;padding:4px">No open cases found</div>';return}
  el.innerHTML=cases.map(c=>
    '<div data-action="link-case" data-case-id="'+esc(c.case_id)+'" data-case-title="'+esc(c.title)+'" style="padding:.4rem .5rem;cursor:pointer;border-radius:4px;font-size:.83rem;color:var(--text)">'+esc(c.title)+'</div>'
  ).join('');
}

async function linkAlertToCase(caseId,caseTitle){
  document.getElementById('addToCaseDropdown').style.display='none';
  try{
    const resp=await apiFetch('/cases/'+encodeURIComponent(caseId)+'/alerts',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({alert_ids:[_modalAlert.alert_id]}),
    });
    if(!resp||!resp.ok){showToast('Failed to link alert','error');return}
    showToast('Alert linked to '+esc(caseTitle));
    loadAlertCaseLinkage(_modalAlert.alert_id);
  }catch(e){
    showToast('Error: '+esc(e.message),'error');
  }
}

// ── CASE DROPDOWN EVENT DELEGATION ───────────────────────────────────────────
document.getElementById('caseDropdownList').addEventListener('mouseover',function(e){
  const item=e.target.closest('[data-action="link-case"]');

});
document.getElementById('caseDropdownList').addEventListener('mouseout',function(e){

document.getElementById('caseDropdownList').addEventListener('click',function(e){
  const item=e.target.closest('[data-action="link-case"]');
  if(item) linkAlertToCase(item.dataset.caseId,item.dataset.caseTitle);
});

document.addEventListener('keydown',e=>{

});
