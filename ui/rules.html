<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TinySIEM — Rules</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/ui/shared.css">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0d0e17;--surface:#12131f;--surface2:#191a2d;--surface3:#1f2138;
  --border:#252840;--border2:#323560;--text:#cdd0eb;--text-dim:#7b7fa8;
  --text-muted:#454870;--accent:#4d9fff;--accent-dim:#0d2a50;--err:#ef4444;--ok:#22c55e;
  --sev-low:#22c55e;--sev-medium:#f59e0b;--sev-high:#ef4444;--sev-critical:#a855f7;
  --mono:'IBM Plex Mono',monospace;--sans:'IBM Plex Sans',sans-serif;
}
[data-theme="light"]{
  --bg:#f0f2f8;--surface:#ffffff;--surface2:#f5f7fc;--surface3:#eaecf5;
  --border:#dde0f0;--border2:#c0c6e0;--text:#1a1c2e;--text-dim:#4a4f6a;
  --text-muted:#9096b8;--accent:#2979ff;--accent-dim:#e3ecff;
}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:var(--sans);font-size:13px;line-height:1.5;overflow:hidden}
.nav-btn{width:30px;height:30px;display:flex;align-items:center;justify-content:center;background:none;border:1px solid var(--border);border-radius:4px;color:var(--text-dim);cursor:pointer;font-size:14px;transition:all .15s}
.nav-btn:hover{color:var(--text);border-color:var(--border2);background:var(--surface3)}
.rules-body{flex:1;display:flex;overflow:hidden}
.list-panel{width:260px;flex-shrink:0;border-right:1px solid var(--border);overflow-y:auto}
.list-panel table{width:100%;border-collapse:collapse}
.list-panel th{padding:8px 12px;font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--text-muted);border-bottom:1px solid var(--border);background:var(--surface);position:sticky;top:0;z-index:1}
.list-panel td{padding:8px 12px;border-bottom:1px solid var(--border);cursor:pointer;vertical-align:middle}
tr.selected td,.list-panel tr:hover td{background:var(--accent-dim)}
.sev{font-size:10px;font-weight:700;text-transform:uppercase}
.sev-low{color:var(--sev-low)}
.sev-medium{color:var(--sev-medium)}
.sev-high{color:var(--sev-high)}
.sev-critical{color:var(--sev-critical)}
.badge-custom{display:inline-block;padding:1px 5px;border-radius:3px;font-size:9px;font-weight:600;background:#0d2a0d;color:var(--ok);margin-left:4px}
.detail-panel{flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:16px}
.detail-empty{flex:1;display:flex;align-items:center;justify-content:center;color:var(--text-muted);font-size:13px}
.section-title{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--text-muted);margin-bottom:8px}
.yaml-area{width:100%;min-height:200px;background:var(--surface2);border:1px solid var(--border2);border-radius:4px;padding:10px;color:var(--text);font-family:var(--mono);font-size:12px;line-height:1.5;resize:vertical;outline:none}
.yaml-area:focus{border-color:var(--accent)}
.yaml-area[readonly]{opacity:.7;cursor:default}
.row-actions{display:flex;gap:8px;margin-top:8px}
.btn{padding:5px 12px;border-radius:4px;border:none;font-size:12px;font-weight:600;cursor:pointer;transition:opacity .15s}
.btn-primary{background:var(--accent);color:#fff}
.btn-secondary{background:var(--surface2);color:var(--text);border:1px solid var(--border2)}
.btn:hover{opacity:.85}
.btn:disabled{opacity:.45;cursor:not-allowed}
.msg{font-size:12px;padding:6px 10px;border-radius:4px;display:none;margin-top:8px}
.msg-ok{background:#0d2a0d;color:var(--ok)}
.msg-err{background:#2a0d0d;color:var(--err)}
.hr{border:none;border-top:1px solid var(--border);margin:4px 0}
.field-input{width:100%;background:var(--surface2);border:1px solid var(--border2);border-radius:4px;padding:7px 10px;color:var(--text);font-family:var(--sans);font-size:12px;outline:none;margin-bottom:8px}
.field-input:focus{border-color:var(--accent)}
</style>
</head>
<body>
<div class="layout">
  <nav class="sidenav" id="sidenav">
    <div class="sidenav-header">
      <a href="/ui/dashboard.html" class="sidenav-logo">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
        <span class="sidenav-logo-text">TinySIEM</span>
      </a>
      <button class="sidenav-collapse-btn" onclick="toggleNav()" title="Toggle sidebar">
        <svg id="collapseIcon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
      </button>
    </div>
    <ul class="sidenav-items">
      <li><a href="/ui/dashboard.html" class="nav-link" title="Home"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg><span class="nav-link-label">Home</span></a></li>
      <li><a href="/ui/events.html" class="nav-link" title="Events"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg><span class="nav-link-label">Events</span></a></li>
      <li><a href="/ui/alerts.html" class="nav-link" title="Alerts"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg><span class="nav-link-label">Alerts</span></a></li>
      <li><a href="/ui/cases.html" class="nav-link" title="Cases"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="7" width="20" height="14" rx="2" ry="2"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/></svg><span class="nav-link-label">Cases</span></a></li>
      <li><a href="/ui/rules.html" class="nav-link active" title="Rules"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg><span class="nav-link-label">Rules</span></a></li>
      <li><a href="/ui/parsers.html" class="nav-link" title="Parsers"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></svg><span class="nav-link-label">Parsers</span></a></li>
      <li><a href="/ui/audit.html" class="nav-link" title="Audit Log"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg><span class="nav-link-label">Audit Log</span></a></li>
      <li><a href="/ui/configuration.html" class="nav-link" title="Configuration"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14M4.93 4.93a10 10 0 0 0 0 14.14"/></svg><span class="nav-link-label">Configuration</span></a></li>
    </ul>
    <div class="sidenav-footer">
      <button class="nav-btn" onclick="toggleTheme()" title="Toggle theme">&#9681;</button>
      <span class="sidenav-user" id="navUser"></span>
      <button class="nav-btn" onclick="logout()" title="Sign out" style="margin-left:auto">&#9167;</button>
    </div>
  </nav>
  <div class="main-wrap">
    <div class="topbar">
      <span class="topbar-title">Rules</span>
      <div style="display:flex;gap:8px;align-items:center">
        <button class="btn btn-primary" id="newBtn" onclick="newRule()" style="display:none">+ New Rule</button>
      </div>
    </div>
    <div class="rules-body">
      <div class="list-panel">
        <table>
          <thead><tr><th>Name</th><th>Sev</th><th>Source</th></tr></thead>
          <tbody id="ruleList"><tr><td colspan="3" style="color:var(--text-muted);padding:16px">Loading&hellip;</td></tr></tbody>
        </table>
      </div>
      <div id="detailWrap" style="flex:1;display:flex;overflow:hidden">
        <div class="detail-empty" id="detailEmpty">Select a rule to view or edit</div>
        <div class="detail-panel" id="detailPanel" style="display:none"></div>
      </div>
    </div>
  </div>
</div>
<script>
const TH=document.documentElement;
const S={navCollapsed:false,theme:'dark',jwt:'',ep:'',role:'',selected:null};

function parseJwt(t){try{const b=t.split('.')[1].replace(/-/g,'+').replace(/_/g,'/');return JSON.parse(atob(b))}catch{return null}}
function clearAuth(){localStorage.removeItem('ts_jwt');localStorage.removeItem('ts_username');localStorage.removeItem('ts_role');localStorage.removeItem('ts_key')}
function logout(){clearAuth();window.location.href='/ui/login.html'}
function updateNavUser(){const el=document.getElementById('navUser');const name=localStorage.getItem('ts_username')||'';const role=localStorage.getItem('ts_role')||'';if(el)el.textContent=name+(role?' \xb7 '+role:'')}
function toggleNav(){S.navCollapsed=!S.navCollapsed;localStorage.setItem('ts_nav_collapsed',String(S.navCollapsed));applyNav()}
function applyNav(){const nav=document.getElementById('sidenav');const icon=document.getElementById('collapseIcon');if(S.navCollapsed){nav.classList.add('collapsed');icon.innerHTML='<polyline points="9 18 15 12 9 6"/>';}else{nav.classList.remove('collapsed');icon.innerHTML='<polyline points="15 18 9 12 15 6"/>';}}
function toggleTheme(){S.theme=TH.getAttribute('data-theme')==='dark'?'light':'dark';TH.setAttribute('data-theme',S.theme);localStorage.setItem('ts_theme',S.theme)}
function esc(s){return String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function sevClass(s){return 'sev sev-'+(s||'low').toLowerCase()}

async function api(path,opts={}){
  const res=await fetch(S.ep+path,{headers:{'Authorization':'Bearer '+S.jwt,'Content-Type':'application/json'},...opts});
  if(res.status===401){logout();return null}
  return res;
}

function showDetail(html){
  document.getElementById('detailEmpty').style.display='none';
  const dp=document.getElementById('detailPanel');
  dp.style.display='flex';
  dp.innerHTML=html;
}
function showEmpty(){
  document.getElementById('detailEmpty').style.display='flex';
  document.getElementById('detailPanel').style.display='none';
}
function showMsg(id,text,type){const el=document.getElementById(id);if(!el)return;el.textContent=text;el.className='msg msg-'+(type==='ok'?'ok':'err');el.style.display='block';setTimeout(()=>{if(el)el.style.display='none'},3500)}

async function loadRules(){
  const r=await api('/rules');
  if(!r)return;
  const data=await r.json();
  const tbody=document.getElementById('ruleList');
  if(!data.rules.length){tbody.innerHTML='<tr><td colspan="3" style="color:var(--text-muted);padding:16px">No rules found</td></tr>';return}
  tbody.innerHTML=data.rules.map(rule=>`
    <tr data-name="${esc(rule.name)}" data-custom="${rule.is_custom}" class="${S.selected===rule.name?'selected':''}">
      <td style="font-family:var(--mono);font-size:11px">${esc(rule.name)}${rule.is_custom?'<span class="badge-custom">custom</span>':''}</td>
      <td><span class="${sevClass(rule.severity)}">${esc(rule.severity)}</span></td>
      <td>${esc(rule.source)}</td>
    </tr>`).join('');
}

async function selectRule(name,isCustom){
  S.selected=name;
  document.querySelectorAll('#ruleList tr').forEach(tr=>{
    tr.classList.toggle('selected',tr.querySelector('td')?.textContent.startsWith(name));
  });
  const r=await api('/rules/'+encodeURIComponent(name));
  if(!r)return;
  const data=await r.json();
  const canEdit=isCustom&&(S.role==='admin'||S.role==='superadmin');
  const canGen=S.role==='admin'||S.role==='superadmin';
  showDetail(`
    <div style="flex:1;display:flex;flex-direction:column;gap:16px">
      <div>
        <div class="section-title">YAML</div>
        <textarea class="yaml-area" id="yamlEditor" ${canEdit?'':'readonly'}>${esc(data.yaml_text)}</textarea>
        ${canEdit?`<div class="row-actions">
          <button class="btn btn-primary" onclick="saveRule()">Save</button>
          <button class="btn btn-secondary" onclick="deleteRule()">Delete</button>
        </div>`:''}
        <div class="msg" id="editMsg"></div>
      </div>
      ${canGen?`<hr class="hr">
      <div>
        <div class="section-title">AI Generator</div>
        <input class="field-input" id="genSource" placeholder="Source (e.g. nginx)">
        <textarea class="yaml-area" id="genDesc" style="min-height:80px" placeholder="Describe the detection in plain English&hellip;"></textarea>
        <div class="row-actions">
          <button class="btn btn-secondary" id="genBtn" onclick="generateRule()">Generate with Claude</button>
        </div>
        <div id="genPreviewWrap" style="display:none;margin-top:12px">
          <div class="section-title">Preview (review before using)</div>
          <textarea class="yaml-area" id="genPreview" style="min-height:160px"></textarea>
          <div class="row-actions">
            <button class="btn btn-primary" onclick="useGenerated()">Use this YAML</button>
          </div>
        </div>
        <div class="msg" id="genMsg"></div>
      </div>`:''}
    </div>
  `);
}

function newRule(){
  S.selected=null;
  document.querySelectorAll('#ruleList tr').forEach(tr=>tr.classList.remove('selected'));
  showDetail(`
    <div style="flex:1;display:flex;flex-direction:column;gap:16px">
      <div>
        <div class="section-title">New Rule</div>
        <input class="field-input" id="newName" placeholder="rule-name (kebab-case)">
        <textarea class="yaml-area" id="yamlEditor" style="min-height:200px" placeholder="Paste YAML or generate below&hellip;"></textarea>
        <div class="row-actions">
          <button class="btn btn-primary" onclick="createRule()">Create</button>
        </div>
        <div class="msg" id="editMsg"></div>
      </div>
      <hr class="hr">
      <div>
        <div class="section-title">AI Generator</div>
        <input class="field-input" id="genSource" placeholder="Source (e.g. nginx)">
        <textarea class="yaml-area" id="genDesc" style="min-height:80px" placeholder="Describe the detection&hellip;"></textarea>
        <div class="row-actions">
          <button class="btn btn-secondary" id="genBtn" onclick="generateRule()">Generate with Claude</button>
        </div>
        <div id="genPreviewWrap" style="display:none;margin-top:12px">
          <div class="section-title">Preview</div>
          <textarea class="yaml-area" id="genPreview" style="min-height:160px"></textarea>
          <div class="row-actions">
            <button class="btn btn-primary" onclick="useGenerated()">Use this YAML</button>
          </div>
        </div>
        <div class="msg" id="genMsg"></div>
      </div>
    </div>
  `);
}

async function createRule(){
  const name=document.getElementById('newName')?.value.trim();
  const yaml=document.getElementById('yamlEditor')?.value;
  if(!name||!yaml){showMsg('editMsg','Name and YAML required','err');return}
  const r=await api('/rules',{method:'POST',body:JSON.stringify({name,yaml_text:yaml})});
  if(!r)return;
  const data=await r.json();
  if(r.ok){showMsg('editMsg','Created','ok');await loadRules();selectRule(name,true)}
  else showMsg('editMsg',data.detail||'Error','err');
}

async function saveRule(){
  const name=S.selected;if(!name)return;
  const yaml=document.getElementById('yamlEditor')?.value;
  const r=await api('/rules/'+encodeURIComponent(name),{method:'PUT',body:JSON.stringify({name,yaml_text:yaml})});
  if(!r)return;
  const data=await r.json();
  if(r.ok)showMsg('editMsg','Saved','ok');
  else showMsg('editMsg',data.detail||'Error','err');
}

async function deleteRule(){
  const name=S.selected;if(!name)return;
  if(!confirm('Delete rule "'+name+'"?'))return;
  const r=await api('/rules/'+encodeURIComponent(name),{method:'DELETE'});
  if(!r)return;
  if(r.ok){S.selected=null;showEmpty();await loadRules()}
}

async function generateRule(){
  const src=document.getElementById('genSource')?.value.trim();
  const desc=document.getElementById('genDesc')?.value.trim();
  const btn=document.getElementById('genBtn');
  const wrap=document.getElementById('genPreviewWrap');
  if(!src||!desc){showMsg('genMsg','Source and description required','err');return}
  btn.disabled=true;btn.textContent='Generating…';
  const r=await api('/rules/generate',{method:'POST',body:JSON.stringify({description:desc,source:src})});
  btn.disabled=false;btn.textContent='Generate with Claude';
  if(!r)return;
  const data=await r.json();
  if(!r.ok){showMsg('genMsg',data.detail||'Error','err');return}
  document.getElementById('genPreview').value=data.yaml_text;
  wrap.style.display='block';
}

function useGenerated(){
  const yaml=document.getElementById('genPreview')?.value;
  const editor=document.getElementById('yamlEditor');
  if(editor)editor.value=yaml;
}

function load(){
  S.theme=localStorage.getItem('ts_theme')||'dark';
  S.navCollapsed=localStorage.getItem('ts_nav_collapsed')==='true';
  if(window.innerWidth<768)S.navCollapsed=true;
  TH.setAttribute('data-theme',S.theme);
  applyNav();
  S.jwt=localStorage.getItem('ts_jwt')||'';
  S.ep=localStorage.getItem('ts_ep')||'http://localhost:8000';
  if(!S.jwt){window.location.href='/ui/login.html';return}
  const p=parseJwt(S.jwt);
  if(!p||p.exp*1000<Date.now()){clearAuth();window.location.href='/ui/login.html';return}
  S.role=p.role||'';
  updateNavUser();
  if(S.role==='admin'||S.role==='superadmin')document.getElementById('newBtn').style.display='inline-flex';
  document.getElementById('ruleList').addEventListener('click',e=>{
    const tr=e.target.closest('tr[data-name]');
    if(tr)selectRule(tr.dataset.name,tr.dataset.custom==='true');
  });
  loadRules();
}
window.addEventListener('DOMContentLoaded',load);
</script>
</body>
</html>
