<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TinySIEM — Home</title>
<link rel="icon" href="/ui/assets/favicon.svg" type="image/svg+xml">
<link rel="alternate icon" href="/ui/assets/favicon-32.png" type="image/png">
<link rel="apple-touch-icon" href="/ui/assets/apple-touch-icon.png">
<link href="fonts.css" rel="stylesheet">
<link rel="stylesheet" href="/ui/shared.css">
<script src="nav.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0d0e17;--surface:#12131f;--surface2:#191a2d;--surface3:#1f2138;
  --border:#252840;--border2:#323560;--text:#cdd0eb;--text-dim:#7b7fa8;
  --text-muted:#454870;--accent:#4d9fff;--accent-dim:#0d2a50;
  --good:#2f9e6e;--bad:#ff5470;--warn:#ff9f43;--amber:#ffd93d;
  --mono:'IBM Plex Mono',monospace;--sans:'IBM Plex Sans',sans-serif;
}
[data-theme="light"]{
  --bg:#f0f2f8;--surface:#ffffff;--surface2:#f5f7fc;--surface3:#eaecf5;
  --border:#dde0f0;--border2:#c0c6e0;--text:#1a1c2e;--text-dim:#4a4f6a;
  --text-muted:#9096b8;--accent:#2979ff;--accent-dim:#e3ecff;
}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:var(--sans);font-size:13px;line-height:1.5;overflow:hidden}
.nav-btn{width:30px;height:30px;display:flex;align-items:center;justify-content:center;background:none;border:1px solid var(--border);border-radius:4px;color:var(--text-dim);cursor:pointer;font-size:14px;transition:all .15s}
.nav-btn:hover{color:var(--text);border-color:var(--border2);background:var(--surface3)}
.home-body{flex:1;overflow-y:auto;display:flex;justify-content:center;padding:40px 20px}
.home-inner{max-width:680px;width:100%;text-align:center;margin:auto}
.home-icon{width:64px;height:64px;border-radius:14px;background:var(--accent);display:flex;align-items:center;justify-content:center;margin:0 auto 20px;color:#fff}
.home-title{font-size:32px;font-weight:700;margin-bottom:12px}
.home-subtitle{font-size:14px;color:var(--text-dim);margin-bottom:28px;line-height:1.6}
.search-box{display:flex;align-items:center;gap:10px;background:var(--surface2);border:1px solid var(--border2);border-radius:10px;padding:14px 18px;margin-bottom:14px;transition:border-color .15s, box-shadow .15s}
.search-box:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-dim)}
.search-box input{flex:1;background:none;border:none;outline:none;color:var(--text);font-family:var(--sans);font-size:14px}
.search-box input::placeholder{color:var(--text-muted)}
.search-box .send-btn{width:32px;height:32px;border-radius:8px;background:var(--surface3);border:none;color:var(--text-muted);display:flex;align-items:center;justify-content:center;flex-shrink:0;cursor:pointer;transition:all .15s}
.search-box .send-btn:hover{color:#fff;background:var(--accent)}
.search-box .send-btn:disabled{opacity:.5;cursor:default}
.suggest{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:-2px 0 22px}
.chip{font-size:12px;color:var(--text-dim);background:var(--surface2);border:1px solid var(--border);border-radius:20px;padding:5px 13px;cursor:pointer;transition:all .15s;user-select:none}
.chip:hover{color:var(--accent);border-color:var(--accent);background:var(--surface3)}
.search-steps{display:flex;gap:8px;justify-content:center;align-items:center;margin-bottom:20px;flex-wrap:wrap}
.step{display:flex;align-items:center;gap:7px;padding:5px 13px;border:1px solid var(--border);border-radius:20px;background:var(--surface2);color:var(--text-muted);font-size:12px;transition:all .2s}
.step .dot{width:8px;height:8px;border-radius:50%;background:var(--border2);flex-shrink:0}
.step.active{border-color:var(--accent);color:var(--text)}
.step.active .dot{background:var(--accent);animation:pulse 1.1s ease-in-out infinite}
.step.done{border-color:var(--good);color:var(--text-dim)}
.step.done .dot{background:var(--good)}
@keyframes pulse{50%{opacity:.35}}
.hidden{display:none!important}
/* result card */
.r-card{text-align:left;background:var(--surface2);border:1px solid var(--border2);border-radius:12px;padding:18px 20px 20px;font-size:13px;line-height:1.6;animation:rise .25s ease}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.r-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.r-badge{font-weight:700;font-size:11px;letter-spacing:.08em;padding:3px 11px;border-radius:20px;text-transform:uppercase}
.r-badge.events{background:var(--accent-dim);color:var(--accent);border:1px solid var(--accent)}
.r-badge.alerts{background:rgba(255,84,112,.12);color:var(--bad);border:1px solid var(--bad)}
.r-badge.cases{background:rgba(255,217,61,.1);color:var(--amber);border:1px solid var(--amber)}
.r-count{font-size:16px;font-weight:700}
.r-window{font-size:11.5px;color:var(--text-dim);background:var(--surface3);border:1px solid var(--border);padding:2px 10px;border-radius:12px}
.r-chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px;padding-bottom:12px;border-bottom:1px solid var(--border)}
.r-chip{font-size:11.5px;padding:3px 10px;border-radius:12px;background:var(--surface3);border:1px solid var(--border2);color:var(--text-dim);font-family:var(--mono)}
.r-chip-warn{font-size:11.5px;padding:3px 10px;border-radius:12px;background:rgba(255,159,67,.12);border:1px solid var(--warn);color:var(--warn);font-family:var(--mono)}
.country-chip{font-size:11.5px;padding:3px 10px;border-radius:12px;background:var(--surface3);border:1px solid var(--border2);color:var(--text-dim)}
.r-answer{color:var(--text);margin-bottom:14px;font-size:13.5px;white-space:pre-wrap}
.r-breakdown{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.sev{font-size:11.5px;font-weight:600;padding:3px 11px;border-radius:12px;text-transform:capitalize}
.sev.critical{background:rgba(255,84,112,.14);color:var(--bad)}
.sev.high{background:rgba(255,159,67,.14);color:var(--warn)}
.sev.medium{background:rgba(255,217,61,.12);color:var(--amber)}
.sev.low{background:rgba(47,158,110,.14);color:var(--good)}
.r-table-wrap{margin-bottom:16px;overflow-x:auto}
.r-table-title{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--text-muted);margin-bottom:6px}
.r-table{width:100%;border-collapse:collapse}
.r-table th{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--text-muted);text-align:left;padding:5px 8px;border-bottom:1px solid var(--border2);font-weight:600}
.r-table td{padding:6px 8px;border-bottom:1px solid var(--border);font-size:12.5px;vertical-align:middle}
.r-table tr:hover td{background:var(--surface3)}
.r-rank{color:var(--text-muted);width:28px}
.r-ip{font-family:var(--mono);color:var(--text)}
.r-flag{letter-spacing:0}
.r-evt{min-width:120px}
.r-bar{height:5px;border-radius:3px;background:var(--accent);opacity:.8;margin-top:4px;transition:width .4s ease}
.r-link{display:inline-flex;align-items:center;gap:7px;color:var(--accent);text-decoration:none;font-weight:600;font-size:12.5px;border:1px solid var(--accent);padding:8px 16px;border-radius:8px;background:var(--accent-dim);transition:all .15s}
.r-link:hover{background:var(--surface3);box-shadow:0 0 0 3px var(--accent-dim)}
.r-fallback{color:var(--text-dim)}
.r-fallback a{color:var(--accent);text-decoration:none}
.r-fallback a:hover{text-decoration:underline}
.home-footer{flex-shrink:0;text-align:center;padding:10px 20px;font-size:11px;color:var(--text-muted);border-top:1px solid var(--border)}
.home-footer a{color:var(--text-dim);text-decoration:none}
.home-footer a:hover{color:var(--accent);text-decoration:underline}
</style>
</head>
<body>
<div class="layout">
  <div id="nav-root"></div>
  <div class="main-wrap">
    <div class="home-body">
      <div class="home-inner">
        <div class="home-icon">
          <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
        </div>
        <div class="home-title">TinySIEM</div>
        <div class="home-subtitle">Ask anything about your logs, alerts, or environment —<br>TinySIEM's AI will search, correlate, and summarize it for you.</div>
        <div class="search-box">
          <input type="text" id="searchInput" placeholder="Ask TinySIEM… e.g. show me critical alerts from the last 24 hours" onkeydown="if(event.key==='Enter')runSearch()" autocomplete="off">
          <button class="send-btn" id="searchBtn" onclick="runSearch()" title="Search">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
          </button>
        </div>
        <div class="suggest" id="suggestRow"></div>
        <div id="searchSteps" class="search-steps hidden"></div>
        <div id="searchResult"></div>
      </div>
    </div>
    <div class="home-footer" id="homeFooter">
      <span id="homeVersion">TinySIEM</span> · MIT Licensed ·
      <a href="https://github.com/netsecid/tinysiem" target="_blank" rel="noopener">GitHub</a> ·
      <a href="https://github.com/netsecid/tinysiem/blob/main/docs/quickstart.md" target="_blank" rel="noopener">Documentation</a>
    </div>
  </div>
</div>
<script>
const TH=document.documentElement;
const SUGGESTIONS=[
  'Top 10 attacking IPs',
  'Failed SSH logins in the last 24h',
  'Critical alerts today',
  'Open cases',
];
const FILTER_CHIP_ORDER=['source','method','source_ip','status_code','uri','rule_name','severity','q'];
const TARGET_BADGE={events:'events',alerts:'alerts',cases:'cases'};
const SEV_ORDER=['critical','high','medium','low'];

(function init(){
  TH.setAttribute('data-theme', localStorage.getItem('ts_theme')||'dark');
  const jwt=localStorage.getItem('ts_jwt')||'';
  if(!jwt){window.location.href='/ui/login.html';return}
  const p=parseJwt(jwt);
  if(!p||p.exp*1000<Date.now()){clearAuth();window.location.href='/ui/login.html';return}
  loadVersion();
  renderSuggestions();
})();

async function loadVersion(){
  const ep=localStorage.getItem('ts_ep')||'http://localhost:8000';
  try{
    const res=await fetch(ep+'/health');
    if(!res.ok)return;
    const h=await res.json();
    document.getElementById('homeVersion').textContent='TinySIEM v'+h.version;
  }catch(e){/* leave default label */}
}

function esc(s){return String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;')}
function fmtNum(n){return (n===undefined||n===null)?'':Number(n).toLocaleString('en-US')}
function flagEmoji(cc){
  if(!cc||!/^[A-Za-z]{2}$/.test(cc))return '';
  return String.fromCodePoint(...cc.toUpperCase().split('').map(c=>127397+c.charCodeAt(0)));
}

function renderSuggestions(){
  const row=document.getElementById('suggestRow');
  row.innerHTML=SUGGESTIONS.map(s=>`<span class="chip" onclick="useSuggestion(this)">${esc(s)}</span>`).join('');
}
function useSuggestion(el){
  const input=document.getElementById('searchInput');
  input.value=el.textContent;
  runSearch();
}

/* --- step progress (Understanding → Searching → Summarizing) --- */
function startSteps(){
  const el=document.getElementById('searchSteps');
  el.classList.remove('hidden');
  el.innerHTML=['Understanding query','Searching','Summarizing']
    .map((l,i)=>`<div class="step" data-step="${i}"><span class="dot"></span>${esc(l)}</div>`).join('');
  const all=el.querySelectorAll('.step');
  all[0].classList.add('active');
  let i=0;
  window._stepTimer=setInterval(()=>{
    i++;
    if(i>=all.length){clearInterval(window._stepTimer);return}
    all[i-1].classList.remove('active');all[i-1].classList.add('done');
    all[i].classList.add('active');
  },1500);
}
function finishSteps(){
  clearInterval(window._stepTimer);
  const el=document.getElementById('searchSteps');
  el.querySelectorAll('.step').forEach(s=>{s.classList.remove('active');s.classList.add('done')});
  setTimeout(()=>el.classList.add('hidden'),700);
}

/* --- result rendering --- */
function renderFilterChips(filters){
  if(!filters||typeof filters!=='object')return '';
  const parts=[];
  for(const k of FILTER_CHIP_ORDER){
    if(filters[k]===undefined||filters[k]===null||filters[k]==='')continue;
    parts.push(`<span class="r-chip" title="${esc(k)}">${esc(k)}=${esc(filters[k])}</span>`);
  }
  return parts.length?`<div class="r-chips">${parts.join('')}</div>`:'';
}

function renderBreakdown(breakdown){
  if(!breakdown||typeof breakdown!=='object')return '';
  const keys=Object.keys(breakdown).filter(k=>SEV_ORDER.includes(k));
  if(!keys.length)return '';
  return '<div class="r-breakdown">'+keys.map(k=>
    `<span class="sev ${esc(k)}">${esc(k)} · ${fmtNum(breakdown[k])}</span>`).join('')+'</div>';
}

function renderTable(table){
  if(!table||!Array.isArray(table.rows)||!table.rows.length)return '';
  const maxC=Math.max(...table.rows.map(r=>Number(r.events)||0),1);
  let html=`<div class="r-table-wrap"><div class="r-table-title">${esc(table.title||'Top source IPs')}</div>`;
  html+='<table class="r-table"><thead><tr><th>#</th><th>IP</th><th>Country</th><th>Events</th></tr></thead><tbody>';
  for(const r of table.rows){
    const pct=Math.max(2,Math.round((Number(r.events)||0)/maxC*100));
    html+=`<tr><td class="r-rank">${esc(r.rank)}</td><td class="r-ip">${esc(r.ip)}</td>`+
      `<td><span class="r-flag">${flagEmoji(r.country)}</span> ${esc(r.country||'—')}</td>`+
      `<td><div class="r-evt">${fmtNum(r.events)}<div class="r-bar" style="width:${pct}%"></div></div></td></tr>`;
  }
  return html+'</tbody></table></div>';
}

function renderResult(d){
  if(!d)return '<div class="r-card"><div class="r-fallback">Empty response.</div></div>';
  const meta=d.meta||{};
  const target=meta.target||'';
  let html='<div class="r-card">';
  if(target&&TARGET_BADGE[target]){
    html+='<div class="r-head">'+
      `<span class="r-badge ${TARGET_BADGE[target]}">${esc(target)}</span>`+
      (meta.count!==undefined?`<span class="r-count">${fmtNum(meta.count)} matched</span>`:'');
    const f=meta.filters||{};
    if(f.start&&f.end){
      const hrs=Math.max(1,Math.round((new Date(f.end)-new Date(f.start))/36e5));
      html+=`<span class="r-window">last ${hrs}h</span>`;
    }
    html+='</div>'+renderFilterChips(f);
  }
  if(meta.dropped&&meta.dropped.length){
    html+='<div class="r-chips">'+meta.dropped.map(d=>
      `<span class="r-chip-warn" title="${esc(d.reason)}">⚠️ ${esc(d.field)}=${esc(d.value)}</span>`).join('')+'</div>';
  }
  if(d.answer)html+=`<div class="r-answer">${esc(d.answer)}</div>`;
  html+=renderBreakdown(d.breakdown);
  if(d.country_breakdown&&d.country_breakdown.length){
    html+='<div class="r-breakdown">'+d.country_breakdown.map(c=>
      `<span class="country-chip">${flagEmoji(c.code)} ${esc(c.code)} · ${fmtNum(c.count)}</span>`).join('')+'</div>';
  }
  html+=renderTable(d.table);
  if(d.link&&typeof d.link==='string'&&d.link.startsWith('/ui/')){
    html+=`<a class="r-link" href="${esc(d.link)}" target="_blank" rel="noopener">${esc(d.link_label||'View results')} →</a>`;
  }
  html+='</div>';
  return html;
}

async function runSearch(){
  const input=document.getElementById('searchInput');
  const question=input.value.trim();
  if(!question)return;
  const resultEl=document.getElementById('searchResult');
  const btn=document.getElementById('searchBtn');
  btn.disabled=true;
  resultEl.innerHTML='';
  startSteps();
  const ep=localStorage.getItem('ts_ep')||'http://localhost:8000';
  const jwt=localStorage.getItem('ts_jwt')||'';
  try{
    const res=await fetch(ep+'/ai/search',{
      method:'POST',
      headers:{'Content-Type':'application/json','Authorization':'Bearer '+jwt},
      body:JSON.stringify({question}),
    });
    if(res.status===401){clearAuth();window.location.href='/ui/login.html';return}
    if(res.status===503||res.status===502){
      const e=await res.json().catch(()=>({}));
      const reason=e.detail||'unknown error';
      resultEl.innerHTML=`<div class="r-card"><div class="r-fallback">AI search isn't available right now (${esc(reason)}). You can still search manually: `
        +`<a href="/ui/events.html">Events</a> · <a href="/ui/alerts.html">Alerts</a> · <a href="/ui/cases.html">Cases</a></div></div>`;
      return;
    }
    if(!res.ok){
      const e=await res.json().catch(()=>({}));
      resultEl.innerHTML=`<div class="r-card"><div class="r-fallback">Error: ${esc(e.detail||res.status)}</div></div>`;
      return;
    }
    const d=await res.json();
    resultEl.innerHTML=renderResult(d);
  }catch(e){
    resultEl.innerHTML=`<div class="r-card"><div class="r-fallback">AI search isn't available right now (network error). You can still search manually: `
      +`<a href="/ui/events.html">Events</a> · <a href="/ui/alerts.html">Alerts</a> · <a href="/ui/cases.html">Cases</a></div></div>`;
  }finally{
    finishSteps();
    btn.disabled=false;
  }
}
</script>
</body>
</html>
