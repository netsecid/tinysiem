<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TinySIEM — Sign In</title>
<link rel="icon" href="/ui/assets/favicon.svg" type="image/svg+xml">
<link rel="alternate icon" href="/ui/assets/favicon-32.png" type="image/png">
<link rel="apple-touch-icon" href="/ui/assets/apple-touch-icon.png">
<link href="fonts.css" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0d0e17;--surface:#12131f;--surface2:#191a2d;--border:#252840;--border2:#323560;
  --text:#cdd0eb;--text-dim:#7b7fa8;--text-muted:#454870;
  --accent:#4d9fff;--accent-dim:#0d2a50;--err:#ef4444;
  --sans:'IBM Plex Sans',sans-serif;--mono:'IBM Plex Mono',monospace;
}
[data-theme="light"]{
  --bg:#f0f2f8;--surface:#ffffff;--surface2:#f5f7fc;--border:#dde0f0;--border2:#c0c6e0;
  --text:#1a1c2e;--text-dim:#4a4f6a;--text-muted:#9096b8;--accent:#2979ff;--accent-dim:#e3ecff;
}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:var(--sans);font-size:13px;line-height:1.5}
.wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:36px 40px;width:100%;max-width:380px}
.logo{display:flex;align-items:center;gap:10px;font-size:17px;font-weight:600;margin-bottom:28px;color:var(--text)}
.logo svg{color:var(--accent);flex-shrink:0}
.field{margin-bottom:14px}
label{display:block;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.07em;color:var(--text-muted);margin-bottom:5px}
input[type=text],input[type=password],input[type=url]{
  width:100%;background:var(--surface2);border:1px solid var(--border2);border-radius:4px;
  padding:8px 10px;color:var(--text);font-family:var(--mono);font-size:12px;outline:none;
  transition:border-color .15s
}
input:focus{border-color:var(--accent)}
.btn{width:100%;padding:9px;background:var(--accent);color:#fff;border:none;border-radius:4px;font-size:13px;font-weight:600;cursor:pointer;margin-top:6px;transition:opacity .15s}
.btn:hover{opacity:.85}
.btn:disabled{opacity:.5;cursor:not-allowed}
.err{color:var(--err);font-size:12px;margin-top:10px;display:none}
.theme-toggle{position:fixed;top:14px;right:14px;background:none;border:1px solid var(--border);border-radius:4px;padding:4px 8px;color:var(--text-dim);cursor:pointer;font-size:13px}
</style>
</head>
<body>
<button class="theme-toggle" onclick="toggleTheme()">◑</button>
<div class="wrap">
  <div class="card">
    <div class="logo">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
      TinySIEM
    </div>
    <div class="field">
      <label for="ep">Server URL</label>
      <input type="url" id="ep" placeholder="http://localhost:8000" autocomplete="off">
    </div>
    <div class="field">
      <label for="uname">Username</label>
      <input type="text" id="uname" placeholder="admin" autocomplete="username">
    </div>
    <div class="field">
      <label for="pass">Password</label>
      <input type="password" id="pass" placeholder="••••••••" autocomplete="current-password">
    </div>
    <button class="btn" id="loginBtn" onclick="doLogin()">Sign in</button>
    <div class="err" id="errMsg"></div>
    <div id="pwChangePanel" style="display:none;margin-top:18px;padding-top:18px;border-top:1px solid var(--border)">
      <div class="field">
        <label>This account must set a new password before continuing.</label>
      </div>
      <div class="field">
        <label for="newPass">New password (12+ characters)</label>
        <input type="password" id="newPass" autocomplete="new-password">
      </div>
      <button class="btn" id="pwChangeBtn" onclick="doChangePassword()">Set new password</button>
    </div>
  </div>
</div>
<script>
const TH = document.documentElement;
function toggleTheme(){const t=TH.getAttribute('data-theme')==='dark'?'light':'dark';TH.setAttribute('data-theme',t);localStorage.setItem('ts_theme',t)}
function parseJwt(token){try{const b64=token.split('.')[1].replace(/-/g,'+').replace(/_/g,'/');return JSON.parse(atob(b64))}catch{return null}}
function load(){
  TH.setAttribute('data-theme', localStorage.getItem('ts_theme')||'dark');
  document.getElementById('ep').value = localStorage.getItem('ts_ep')||'http://localhost:8000';
  const jwt = localStorage.getItem('ts_jwt');
  if(jwt){
    const p = parseJwt(jwt);
    if(p && p.exp*1000 > Date.now()){window.location.href='/ui/home.html';return}
  }
  localStorage.removeItem('ts_jwt');
}
async function doLogin(){
  const btn=document.getElementById('loginBtn');
  const errEl=document.getElementById('errMsg');
  const ep=(document.getElementById('ep').value.trim()||'http://localhost:8000').replace(/\/+$/,'');
  const username=document.getElementById('uname').value.trim();
  const password=document.getElementById('pass').value;
  errEl.style.display='none';
  if(!username||!password){errEl.textContent='Username and password are required.';errEl.style.display='block';return}
  btn.disabled=true;btn.textContent='Signing in…';
  try{
    const res=await fetch(`${ep}/auth/login`,{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({username,password})
    });
    const data=await res.json();
    if(!res.ok){errEl.textContent=data.detail||'Login failed';errEl.style.display='block';return}
    localStorage.setItem('ts_ep',ep);
    localStorage.setItem('ts_jwt',data.access_token);
    localStorage.setItem('ts_username',data.username);
    localStorage.setItem('ts_role',data.role);
    if(data.must_change_password){
      window._tsCurrentPass=password;
      document.getElementById('pwChangePanel').style.display='block';
      document.getElementById('loginBtn').style.display='none';
      return;
    }
    window.location.href='/ui/home.html';
  }catch(e){
    errEl.textContent='Could not connect. Check the Server URL.';
    errEl.style.display='block';
  }finally{
    btn.disabled=false;btn.textContent='Sign in';
  }
}
async function doChangePassword(){
  const btn=document.getElementById('pwChangeBtn');
  const errEl=document.getElementById('errMsg');
  const ep=localStorage.getItem('ts_ep');
  const newPass=document.getElementById('newPass').value;
  errEl.style.display='none';
  if(newPass.length<12){errEl.textContent='New password must be at least 12 characters.';errEl.style.display='block';return}
  btn.disabled=true;btn.textContent='Updating…';
  try{
    const res=await fetch(`${ep}/auth/change-password`,{
      method:'POST',
      headers:{'Content-Type':'application/json','Authorization':`Bearer ${localStorage.getItem('ts_jwt')}`},
      body:JSON.stringify({current_password:window._tsCurrentPass,new_password:newPass})
    });
    const data=await res.json();
    if(!res.ok){errEl.textContent=data.detail||'Could not update password';errEl.style.display='block';return}
    localStorage.setItem('ts_jwt',data.access_token);
    window.location.href='/ui/home.html';
  }catch(e){
    errEl.textContent='Could not connect. Check the Server URL.';
    errEl.style.display='block';
  }finally{
    btn.disabled=false;btn.textContent='Set new password';
  }
}
document.getElementById('pass').addEventListener('keydown',e=>{if(e.key==='Enter')doLogin()});
window.addEventListener('DOMContentLoaded',load);
</script>
</body>
</html>
