name: fail2ban
source: fail2ban
type: regex
# fail2ban's own log format (NOT syslog): "YYYY-MM-DD HH:MM:SS,mmm fail2ban.<comp> [pid]: LEVEL [jail] Action IP - note".
# Action = Ban | Unban | Found; the "- note" tail only exists on Found lines.
# timestamps are server-local (no offset written) — declared via timestamp_tz.
pattern: '^(?P<timestamp>\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2}),\d{3} fail2ban\.(?P<component>\w+)\s+\[(?P<pid>\d+)\]:\s+(?P<level>\w+)\s+\[(?P<jail>\w+)\]\s+(?P<action>Ban|Unban|Found)\s+(?P<source_ip>\d{1,3}(?:\.\d{1,3}){3})(?:\s+-\s+(?P<note>.+))?$'
timestamp_field: event_time
timestamp_format: '%Y-%m-%d %H:%M:%S'
timestamp_tz: '+08:00'
fields:
  event_time: timestamp
  source_ip: source_ip
  method: action
  action: action
  jail: jail
  level: level
  component: component
  note: note
